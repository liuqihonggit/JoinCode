name: Feature Request
description: Suggest a new feature or enhancement
title: "[Feature]: "
labels: ["enhancement", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for suggesting a feature!
        Before submitting, please search [existing issues](https://github.com/JoinCode/JoinCode/issues?q=is%3Aissue+label%3Aenhancement) to avoid duplicates.

  - type: textarea
    id: problem
    attributes:
      label: Problem Statement
      description: What problem does this feature solve? What are you trying to do that is currently difficult?
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
      description: Describe the feature or change you'd like to see.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: What other approaches have you considered?

  - type: dropdown
    id: area
    attributes:
      label: Affected Area
      options:
        - CLI / Commands
        - TUI Interface
        - LLM / Provider Support
        - MCP / Tools
        - Agent / Multi-Agent
        - Security / Permissions
        - Build / CI
        - Documentation
        - Other
    validations:
      required: true

  - type: checkboxes
    id: adr
    attributes:
      label: Architecture Impact
      options:
        - label: This feature may require a new Architecture Decision Record (ADR)
          required: false

  - type: textarea
    id: context
    attributes:
      label: Additional Context
      description: Any mockups, examples, or references to similar features in other tools.

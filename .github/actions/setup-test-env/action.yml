name: 'Setup Test Environment'
description: 'Setup .NET SDK, cache NuGet, download NuGet packages, set local feed, set UTF-8 encoding (requires checkout before use)'

inputs:
  nuget-artifact-name:
    description: 'Name of the NuGet packages artifact to download'
    required: false
    default: 'nuget-packages'
  build-e2e-exes:
    description: 'Build MockServer exes needed by E2E tests'
    required: false
    default: 'false'

runs:
  using: 'composite'
  steps:
    - name: Setup .NET SDK
      uses: actions/setup-dotnet@v5
      with:
        global-json-file: 'global.json'

    - name: Cache NuGet Packages
      uses: actions/cache@v5
      with:
        path: ${{ github.workspace }}/.nuget/packages
        key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', 'Directory.Build.props') }}
        restore-keys: |
          nuget-${{ runner.os }}-

    - name: Download NuGet Packages
      uses: actions/download-artifact@v8
      with:
        name: ${{ inputs.nuget-artifact-name }}
        path: artifacts/nuget/

    # NuGet 缓存 key 只哈希 csproj+props，不含 .cs 源码 — 只改源码的 PR 会命中旧缓存里的
    # 过期 JoinCode 组件包（版本恒 1.0.0 无法靠版本号辨新旧），而源码生成器（analyzer 恒新）
    # 输出引用新 API → CS0117 编译错。删缓存里的自家组件包强制从 local-feed（本次 pack 的
    # 最新 artifact）重解析；第三方大包（网络下载大头）缓存照常命中，仅本地磁盘重拷秒级。
    - name: Purge Stale JoinCode Component Packages from Cache
      shell: pwsh
      run: |
        $pkgRoot = Join-Path $env:GITHUB_WORKSPACE ".nuget" "packages"
        if (Test-Path $pkgRoot) {
          $stale = Get-ChildItem -Path $pkgRoot -Directory -Filter "joincode.*"
          if ($stale) {
            $stale | ForEach-Object { Write-Host "purging: $($_.Name)" }
            Remove-Item -Path $stale.FullName -Recurse -Force
            Write-Host "Purged $($stale.Count) JoinCode package(s) — restore re-resolves from local feed (latest pack)"
          } else {
            Write-Host "No JoinCode packages in cache — nothing to purge"
          }
        }

    - name: Add Local NuGet Feed
      shell: pwsh
      run: |
        $feedPath = Join-Path $env:GITHUB_WORKSPACE "artifacts" "nuget"
        $nugetConfig = Join-Path $env:GITHUB_WORKSPACE "nuget.config"
        [xml]$config = Get-Content $nugetConfig
        $sources = $config.configuration.packageSources
        $existing = $sources.SelectSingleNode("add[@key='local-feed']")
        if ($existing) { $sources.RemoveChild($existing) }
        $add = $config.CreateElement("add")
        $add.SetAttribute("key", "local-feed")
        $add.SetAttribute("value", $feedPath)
        $sources.AppendChild($add)
        $config.Save($nugetConfig)

    - name: Set Console Encoding to UTF-8
      shell: pwsh
      run: |
        if ($IsWindows) { chcp 65001 }
        [Console]::OutputEncoding = [System.Text.Encoding]::UTF8
        [Console]::InputEncoding = [System.Text.Encoding]::UTF8

    - name: Install Linux Dependencies for SkiaSharp
      if: runner.os == 'Linux'
      shell: bash
      run: |
        if dpkg -s libfontconfig1 >/dev/null 2>&1; then
          echo "libfontconfig1 already installed, skipping apt"
          exit 0
        fi
        sudo apt-get update || echo "::warning::apt-get update failed (third-party repo flaky, e.g. MS repo 403), continuing with cached indexes"
        sudo apt-get install -y libfontconfig1

    - name: Download E2E Exes (for E2E)
      if: inputs.build-e2e-exes == 'true'
      uses: actions/download-artifact@v8
      with:
        name: e2e-exes
        path: artifacts/bin/

    - name: Set Execute Permission (Linux)
      if: inputs.build-e2e-exes == 'true' && runner.os == 'Linux'
      shell: bash
      run: find artifacts/bin/ -type f -exec chmod +x {} + 2>/dev/null || true

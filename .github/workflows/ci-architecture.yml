name: Architecture Gate

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Validate architecture baseline and allowlist
        shell: pwsh
        run: ./non_deliverables_tools/architecture/ArchitectureGate.ps1 -Mode Validate

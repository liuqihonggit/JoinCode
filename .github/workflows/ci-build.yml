name: CI Build

on:
  workflow_call:

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  DOTNET_NOLOGO: true
  NUGET_XMLDOC_MODE: skip
  NUGET_PACKAGES: ${{ github.workspace }}/.nuget/packages
  Configuration: Debug
  JCC_API_TIMEOUT_MS: 30000

jobs:
  build:
    name: Build
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: 'global.json'

      - name: Cache NuGet Packages
        uses: actions/cache@v5
        with:
          path: ${{ github.workspace }}/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', 'Directory.Build.props') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      - name: Cache Component NuGet Packages + E2E Exes (incremental build)
        id: component-cache
        uses: actions/cache@v5
        with:
          path: |
            artifacts/nuget
            artifacts/bin/OpenAI.MockServer
            artifacts/bin/Anthropic.MockServer
            artifacts/bin/DeepSeek.MockServer
            artifacts/bin/Mcp.MockServer
          key: component-pkgs-${{ runner.os }}-${{ hashFiles('lib/**/*.cs', 'lib/**/*.csproj', 'gen/**/*.cs', 'gen/**/*.csproj', 'llm/**/*.cs', 'llm/**/*.csproj', 'server/**/*.cs', 'server/**/*.csproj', 'kit/**/*.cs', 'kit/**/*.csproj', 'tool/**/*.cs', 'tool/**/*.csproj', 'Directory.Build.props', 'Directory.Build.targets', 'global.json', 'build/sln/JoinCode.slnx') }}

      - name: Restore
        if: steps.component-cache.outputs.cache-hit != 'true'
        run: dotnet restore build/sln/JoinCode.slnx --nologo

      - name: Build (all)
        if: steps.component-cache.outputs.cache-hit != 'true'
        run: >
          dotnet build build/sln/JoinCode.slnx
          -c Debug --no-restore --nologo -m
          /p:SkipLocalPack=true /p:JccAnalyzers=false /p:EnableNETAnalyzers=false /p:AnalysisLevel=none

      - name: Pack (components → NuGet)
        if: steps.component-cache.outputs.cache-hit != 'true'
        run: >
          dotnet pack build/sln/JoinCode.slnx
          -c Debug --no-build --nologo
          -o ${{ github.workspace }}/artifacts/nuget
          /p:JccAnalyzers=false /p:EnableNETAnalyzers=false /p:AnalysisLevel=none

      - name: Upload NuGet Packages
        uses: actions/upload-artifact@v7
        with:
          name: nuget-packages
          path: artifacts/nuget/**/*.nupkg
          retention-days: 1

      - name: Upload E2E Exes
        uses: actions/upload-artifact@v7
        with:
          name: e2e-exes
          path: |
            artifacts/bin/OpenAI.MockServer/Debug/net10.0/
            artifacts/bin/Anthropic.MockServer/Debug/net10.0/
            artifacts/bin/DeepSeek.MockServer/Debug/net10.0/
            artifacts/bin/Mcp.MockServer/Debug/net10.0/
          retention-days: 1

name: CI Build

on:
  workflow_call:

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  DOTNET_NOLOGO: true
  NUGET_XMLDOC_MODE: skip
  NUGET_PACKAGES: ${{ github.workspace }}/.nuget/packages
  Configuration: Release
  JCC_API_TIMEOUT_MS: 30000

jobs:
  build:
    name: Build
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: 'global.json'

      - name: Cache NuGet Packages
        uses: actions/cache@v5
        with:
          path: ${{ github.workspace }}/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', 'Directory.Build.props') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      - name: Restore
        run: dotnet restore build/sln/JoinCode.slnx --nologo

      - name: Build (all)
        run: >
          dotnet build build/sln/JoinCode.slnx
          -c Release --no-restore --nologo -m
          /p:SkipLocalPack=true /p:JccAnalyzers=false /p:EnableNETAnalyzers=false /p:AnalysisLevel=none

      - name: Upload Build Output
        uses: actions/upload-artifact@v7
        with:
          name: build-output
          path: |
            artifacts/bin/
            !artifacts/bin/JoinCodeTui/
            !artifacts/bin/JoinCodeGui/
            !artifacts/bin/JoinCodeGui.Tests/
            !artifacts/bin/SkiaSharpAotTest/
            !artifacts/bin/TerminalGuiAotProbe/
            !artifacts/bin/Tui.Tests/
            !artifacts/bin/Eyes.Benchmarks/
            !artifacts/bin/AsyncLock.Benchmarks/
            !artifacts/bin/JccAuditCli/
            !artifacts/bin/JccAuditCli.Tests/
            !artifacts/bin/InjectMigration/
            !artifacts/bin/JccInteractiveTester/
            !artifacts/bin/SampleNativePlugin/
            !artifacts/bin/aot-browser-test/
            !artifacts/bin/aot-httpclientfactory-test/
            !artifacts/bin/PptrApiCheck/
            !**/runtimes/linux-arm/
            !**/runtimes/linux-arm64/
            !**/runtimes/linux-x64/
            !**/runtimes/linux-x86/
            !**/runtimes/linux-musl-x64/
            !**/runtimes/osx-x64/
            !**/runtimes/osx-arm64/
            !**/runtimes/win-x86/
            !**/runtimes/win-arm64/
            !**/runtimes/unix/
            !**/runtimes/linux/
            !**/runtimes/osx/
            !**/*.pdb
            !**/*.xml
          retention-days: 1

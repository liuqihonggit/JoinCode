name: CI Integration Tests

on:
  workflow_call:

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  DOTNET_NOLOGO: true
  NUGET_XMLDOC_MODE: skip
  NUGET_PACKAGES: ${{ github.workspace }}/.nuget/packages
  Configuration: Debug

jobs:
  integration-core:
    name: Integration - Core
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          submodules: recursive
      - uses: ./.github/actions/setup-test-env
      - name: Integration Tests
        shell: pwsh
        run: |
          $tests = @(
            @{Name="integration-all"; Csproj="test/integration/integration.tests/Integration.Tests.csproj"; Filter="Category!=Benchmark"},
            @{Name="integration-prefixcache"; Csproj="build/sln/App.slnx"; Filter="Category=Integration&FullyQualifiedName~PrefixCache"}
          )
          foreach ($t in $tests) {
              $name = $t.Name
              $csproj = $t.Csproj
              $filter = $t.Filter
              & dotnet test $csproj -c Debug --nologo `
                /p:UsePackedComponents=true `
                /p:JccAnalyzers=false /p:EnableNETAnalyzers=false /p:AnalysisLevel=none `
                --filter $filter `
                --logger "console;verbosity=normal" `
                --logger "trx;LogFileName=$name.trx" 2>&1 | Out-Host
              if ($LASTEXITCODE -ne 0) { throw "Test FAILED: $name" }
          }
      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: integration-results-core
          path: '**/*.trx'
          retention-days: 7

  integration-safety:
    name: Integration - Safety
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          submodules: recursive
      - uses: ./.github/actions/setup-test-env
      - name: Integration Tests
        shell: pwsh
        run: |
          $tests = @(
            @{Name="integration-brain-clock"; Filter="Category=Integration&(FullyQualifiedName~Brain|FullyQualifiedName~Clock)"},
            @{Name="integration-guard-vault"; Filter="Category=Integration&(FullyQualifiedName~Guard|FullyQualifiedName~Vault)"}
          )
          foreach ($t in $tests) {
              $name = $t.Name
              $filter = $t.Filter
              & dotnet test build/sln/App.slnx -c Debug --nologo `
                /p:UsePackedComponents=true `
                /p:JccAnalyzers=false /p:EnableNETAnalyzers=false /p:AnalysisLevel=none `
                --filter $filter `
                --logger "console;verbosity=normal" `
                --logger "trx;LogFileName=$name.trx" 2>&1 | Out-Host
              if ($LASTEXITCODE -ne 0) { throw "Test FAILED: $name" }
          }
      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: integration-results-safety
          path: '**/*.trx'
          retention-days: 7

  integration-app:
    name: Integration - App
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          submodules: recursive
      - uses: ./.github/actions/setup-test-env
      - name: Integration Tests - Hands + Host + McpTools
        run: >
          dotnet test build/sln/App.slnx
          -c Debug --nologo
          /p:UsePackedComponents=true
          /p:JccAnalyzers=false /p:EnableNETAnalyzers=false /p:AnalysisLevel=none
          --filter "Category=Integration&(FullyQualifiedName~Hands|FullyQualifiedName~Host|FullyQualifiedName~McpTools)"
          --logger "console;verbosity=detailed"
          --logger "trx;LogFileName=integration-hands-host-mcp.trx"
      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: integration-results-app
          path: '**/integration-hands-host-mcp.trx'
          retention-days: 7

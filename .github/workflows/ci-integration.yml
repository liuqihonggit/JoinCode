          --filter "Category=Integration&(FullyQualifiedName~Guard|FullyQualifiedName~Vault)"
          --logger "console;verbosity=detailed"
          --logger "trx;LogFileName=integration-guard-vault.trx"
      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: integration-results-guard-vault
          path: '**/integration-guard-vault.trx'
          retention-days: 7

  integration-hands-host-mcp:
    name: Integration - Hands + Host + McpTools
    runs-on: windows-latest

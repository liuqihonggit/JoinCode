name: CI Integration Tests

on:
  workflow_call:

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  DOTNET_NOLOGO: true
  NUGET_XMLDOC_MODE: skip
  NUGET_PACKAGES: ${{ github.workspace }}/.nuget/packages
  Configuration: Debug

jobs:
  integration-core:
    name: Integration - Core
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          submodules: recursive
      - uses: ./.github/actions/setup-test-env
      - name: Integration Tests
        shell: bash
        run: |
          set -e
          dotnet test test/integration/integration.tests/Integration.Tests.csproj \
            -c Debug --nologo \
            -p:UsePackedComponents=true \
            -p:JccAnalyzers=false -p:EnableNETAnalyzers=false -p:AnalysisLevel=none \
            --filter "Category!=Benchmark" \
            --logger "console;verbosity=normal" \
            --logger "trx;LogFileName=integration-all.trx"
          dotnet test build/sln/JoinCode.slnx \
            -c Debug --nologo \
            -p:UsePackedComponents=true \
            -p:JccAnalyzers=false -p:EnableNETAnalyzers=false -p:AnalysisLevel=none \
            --filter "Category=Integration&FullyQualifiedName~PrefixCache" \
            --logger "console;verbosity=normal" \
            --logger "trx;LogFileName=integration-prefixcache.trx"
      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: integration-results-core
          path: '**/*.trx'
          retention-days: 7

  integration-safety:
    name: Integration - Safety
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          submodules: recursive
      - uses: ./.github/actions/setup-test-env
      - name: Integration Tests
        shell: bash
        run: |
          set -e
          dotnet test build/sln/JoinCode.slnx \
            -c Debug --nologo \
            -p:UsePackedComponents=true \
            -p:JccAnalyzers=false -p:EnableNETAnalyzers=false -p:AnalysisLevel=none \
            --filter "Category=Integration&(FullyQualifiedName~Brain|FullyQualifiedName~Clock)" \
            --logger "console;verbosity=normal" \
            --logger "trx;LogFileName=integration-brain-clock.trx"
          dotnet test build/sln/JoinCode.slnx \
            -c Debug --nologo \
            -p:UsePackedComponents=true \
            -p:JccAnalyzers=false -p:EnableNETAnalyzers=false -p:AnalysisLevel=none \
            --filter "Category=Integration&(FullyQualifiedName~Guard|FullyQualifiedName~Vault)" \
            --logger "console;verbosity=normal" \
            --logger "trx;LogFileName=integration-guard-vault.trx"
      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: integration-results-safety
          path: '**/*.trx'
          retention-days: 7

  integration-app:
    name: Integration - App
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          submodules: recursive
      - uses: ./.github/actions/setup-test-env
      - name: Integration Tests - Hand + Host + McpTools
        shell: bash
        run: |
          set -e
          dotnet test test/integration/integration.tests/Integration.Tests.csproj \
            -c Debug --nologo \
            -p:UsePackedComponents=true \
            -p:JccAnalyzers=false -p:EnableNETAnalyzers=false -p:AnalysisLevel=none \
            --filter "Category=Integration&(FullyQualifiedName~Hands|FullyQualifiedName~Host|FullyQualifiedName~McpTools)" \
            --logger "console;verbosity=detailed" \
            --logger "trx;LogFileName=integration-hands-host-mcp.trx"
      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: integration-results-app
          path: '**/integration-hands-host-mcp.trx'
          retention-days: 7

name: CI Integration Tests

on:
  workflow_call:

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  DOTNET_NOLOGO: true
  NUGET_XMLDOC_MODE: skip
  NUGET_PACKAGES: ${{ github.workspace }}/.nuget/packages
  Configuration: Release

jobs:
  integration-tests:
    name: Integration - All (Integration.Tests)
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - uses: ./.github/actions/setup-test-env
      - name: Integration Tests
        run: >
          dotnet test tests/Integration/Integration.Tests/Integration.Tests.csproj
          -c Release --no-build --nologo
          --filter "Category!=Benchmark"
          --logger "console;verbosity=detailed"
          --logger "trx;LogFileName=integration-all.trx"
      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: integration-results-all
          path: '**/integration-all.trx'
          retention-days: 7

  integration-brain-clock:
    name: Integration - Brain + Clock
    runs-on: windows-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - uses: ./.github/actions/setup-test-env
      - name: Integration Tests - Brain + Clock
        run: >
          dotnet test App.slnx
          -c Release --no-build --nologo
          --filter "Category=Integration&(FullyQualifiedName~Brain|FullyQualifiedName~Clock)"
          --logger "console;verbosity=detailed"
          --logger "trx;LogFileName=integration-brain-clock.trx"
      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: integration-results-brain-clock
          path: '**/integration-brain-clock.trx'
          retention-days: 7

  integration-guard-vault:

name: CI Unit Tests

on:
  workflow_call:

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  DOTNET_NOLOGO: true
  NUGET_XMLDOC_MODE: skip
  NUGET_PACKAGES: ${{ github.workspace }}/.nuget/packages
  Configuration: Debug

jobs:
  unit-tests:
    name: Unit - ${{ matrix.domain }}
    runs-on: ${{ matrix.os || 'ubuntu-24.04' }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - domain: generators
            csprojs: modules/generators/aot_safety.tests/AotSafety.Tests.csproj modules/generators/fsm.generator.tests/Fsm.Generator.Tests.csproj
          - domain: collections
            csprojs: modules/collections/structura.tests/Structura.Tests.csproj
          - domain: async_primitives
            csprojs: modules/async_primitives/async_lock.tests/AsyncLock.Tests.csproj modules/async_primitives/bcl_bridge.tests/JoinCode.BclBridge.Tests.csproj modules/async_primitives/transport.impl.tests/Transport.Impl.Tests.csproj
          - domain: abstractions
            csprojs: test/unit/infra.tests/io/Infra.IO.Tests.csproj test/unit/infra.tests/services/Infra.Services.Tests.csproj test/unit/infra.tests/utils/Infra.Utils.Tests.csproj test/unit/abs.core.tests/Abs.Core.Tests.csproj test/unit/abs.ai.tests/Abs.Ai.Tests.csproj test/unit/abs.guard.tests/Abs.Guard.Tests.csproj test/unit/abs.hands.tests/Abs.Hands.Tests.csproj
          # ADR 0157 工具节点的契约层：node.yaml 解析、-h 索引/检索、名称规范化、覆盖率统计。
          # 此前这些测试没进 CI，等于「本地全绿、CI 看不见」。
          - domain: cli_nodes
            csprojs: modules/abstractions/abstractions.primitives.tools.tests/Abstractions.Primitives.Tools.Tests.csproj
          - domain: guard
            csprojs: modules/guard/guard.config.tests/Guard.Config.Tests.csproj modules/guard/guard.hooks.tests/Guard.Hooks.Tests.csproj modules/guard/guard.security.tests/Guard.Security.Tests.csproj
          - domain: storage
            csprojs: modules/storage/clock.tests/Clock.Tests.csproj modules/storage/downloader.tests/Downloader.Tests.csproj modules/storage/scheduling.tests/Scheduling.Tests.csproj modules/storage/vault.memdir.tests/Vault.Memdir.Tests.csproj modules/storage/vault.other.tests/Vault.Other.Tests.csproj
          - domain: plugins
            csprojs: modules/plugins/plugins.tests/Plugins.Tests.csproj
          - domain: mcp
            csprojs: modules/mcp/mcp.tests/Mcp.Tests.csproj modules/mcp/mcp_tool_dispatch.tests/McpToolDispatch.Tests.csproj test/unit/mcp.tests/Mcp.UniqueTests.csproj test/unit/mcp_tool_dispatch.tests/McpToolDispatch.UniqueTests.csproj
          - domain: llm
            csprojs: modules/llm/llm.tests/Llm.Tests.csproj modules/llm/agents.tests/Agents.Tests.csproj modules/llm/reasoning.tests/Reasoning.Tests.csproj
          - domain: cognition
            csprojs: modules/cognition/brain.context.tests/Brain.Context.Tests.csproj modules/cognition/brain.other.tests/Brain.Other.Tests.csproj modules/cognition/brain.prompts.tests/Brain.Prompts.Tests.csproj modules/cognition/hands.api.tests/Hands.Api.Tests.csproj modules/cognition/hands.shell.tests/Hands.Shell.Tests.csproj modules/cognition/hands.skills.tests/Hands.Skills.Tests.csproj modules/cognition/hands.tool_handlers.tests/Hands.ToolHandlers.Tests.csproj test/unit/hands.tests/Hands.Tests.csproj
          - domain: perception
            csprojs: modules/perception/code_index.tests/CodeIndex.Tests.csproj modules/perception/eyes.tests/Eyes.Tests.csproj modules/perception/vision.tests/Vision.Tests.csproj
          - domain: services
            csprojs: modules/services/bridge.tests/Bridge.Tests.csproj modules/services/browser.tests/Browser.Tests.csproj modules/services/dream.tests/Dream.Tests.csproj test/mock/mock_server.core.tests/MockServer.Core.Tests.csproj
          - domain: composition
            csprojs: modules/composition/composition.tests/Composition.Tests.csproj modules/composition/pipelines.tests/Pipelines.Tests.csproj
          - domain: apps
            # Host.Tests（CLI 侧）跨平台，ubuntu 跑
            csprojs: test/unit/host.tests/Host.Tests.csproj
          - domain: tools
            csprojs: modules/tools/rg.tests/Rg.Tests.csproj modules/tools/gh.tests/Gh.Tests.csproj
          - domain: gui-core
            # GUI 协议核心（ADR 0145 B3）：纯 net10.0 零 Avalonia/WebView2 — ubuntu 可跑，windows job 收窄
            os: ubuntu-24.04
            csprojs: native_gui/tests/native_gui.core.tests/NativeGui.Core.Tests.csproj
          - domain: gui-host
            # GUI 宿主表现层：CsWinRT 投影工具链（Windows PE）+ WebView2 仅 Windows 原生可跑
            os: windows-latest
            csprojs: native_gui/tests/native_gui.host.tests/NativeGui.Host.Tests.csproj

    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - uses: ./.github/actions/setup-test-env
      - name: Test - ${{ matrix.domain }}
        shell: bash
        run: |
          set -e
          # 先编译所有项目（-m 并行编译，共享依赖只编译一次，增量编译跳过已编译项目）
          for proj in ${{ matrix.csprojs }}; do
            echo "=== Building: $proj ==="
            dotnet build "$proj" -c Debug --nologo -m \
              -p:UsePackedComponents=true \
              -p:JccAnalyzers=false -p:EnableNETAnalyzers=false -p:AnalysisLevel=none
          done
          # 用 --no-build 运行测试（复用编译产物）
          for proj in ${{ matrix.csprojs }}; do
            name=$(basename "$proj" .csproj)
            echo "=== Testing: $proj ==="
            dotnet test "$proj" -c Debug --nologo --no-build \
              -p:UsePackedComponents=true \
              -p:JccAnalyzers=false -p:EnableNETAnalyzers=false -p:AnalysisLevel=none \
              --filter "Category!=Integration&Category!=Benchmark" \
              --logger "console;verbosity=normal" \
              --logger "trx;LogFileName=$name.trx"
          done
      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: unit-test-results-${{ matrix.domain }}
          path: '**/*.trx'
          retention-days: 7

  # ADR 0157 工具节点的声明侧对账：13 份 node.yaml 各自自洽 + 与 group_map.yaml 双向一致。
  # 不需要编译、不跑 exe，几秒结束，所以够格进 PR 门禁 —— 此前这类漂移只有人工会看。
  # 与下面的 tool-node-reality 分成两个 job：声明侧秒级失败，定位比等 13 个 exe 编完快得多。
  tool-node-declarations:
    name: Tool Nodes - declarations
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Verify node.yaml and group_map.yaml consistency
        shell: pwsh
        run: pwsh -ExecutionPolicy Bypass -File non_deliverables_tools/scripts/Verify-ToolNodes.ps1 -DeclarationsOnly

  # 「谁先执行」只能由 resources/orders.yaml 说了算 —— 门禁守住这条纪律。
  # 以前每个实现类里写一个 Priority 数字（守卫链有 30/50/100/200/500/800/900/1000 八个离散值），
  # 想知道谁先评估必须横向比对全部数字；数字与注册名还是两套标识，改类名要同步改数字。
  # 这个 job 三件事：
  #   ① 每个接口的实现类都必须在 orders.yaml 对应列表里登记（漏登记 → 启动期直接抛异常）；
  #   ② 登记的每个名字都必须有真实实现（登记了不存在的名字 → 顺序表在骗人）；
  #   ③ 实现类里不许再出现字面量位次数字，且列表顺序必须与迁移前基线一致（迁移只改表达方式）。
  registration-order:
    name: Registration order table
    runs-on: windows-latest
    timeout-minutes: 5
    env:
      PYTHONIOENCODING: utf-8
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Verify orders.yaml against source implementations
        shell: pwsh
        run: python non_deliverables_tools/scripts/Verify-RegistrationOrder.py

  # 诚实清单是「切换模型时对用户说的话」的事实来源，它和给人看的 TASK083 文档必须同源。
  # 分开维护一定会漂移：清单加了项、文档忘打勾 → 用户看到「全部完成」，文档里还留着未完成项。
  # 那正是「诚实模块」自己变得不诚实的方式，所以让它在 CI 里红一次，而不是在用户面前错一次。
  honesty-checklist:
    name: Honesty checklist matches doc
    runs-on: windows-latest
    timeout-minutes: 5
    env:
      PYTHONIOENCODING: utf-8
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Verify checklist.yaml against TASK083 doc
        shell: pwsh
        run: python non_deliverables_tools/scripts/Verify-HonestyChecklist.py

  # 零锁并发红线 — JCC4008 分析器负责语义判定，本门禁负责文本基线只减不增：
  # 存量锁按文件登记次数，新增文件/次数增加/基线未收紧都会红；B6 归档锁生态后基线清零。
  lock-primitive-gate:
    name: Lock primitives - baseline only decreases
    runs-on: windows-latest
    timeout-minutes: 5
    env:
      PYTHONIOENCODING: utf-8
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Verify lock primitive baseline against source
        shell: pwsh
        run: python non_deliverables_tools/scripts/Verify-NoLockPrimitives.py

  # 显式模块顺序 — 真机核对 CLI 与 GUI 两套装配：
  #   ① CLI：启动 jcc，比对实际模块启动顺序 == resources/app/modules.yaml 的 cli profile；
  #   ② GUI：启动探针真建一次引擎会话，比对 [MODULE] 顺序 == gui profile。
  # gui 这条路径此前是「手写 YAML 解析 + 手写 switch」，与 CLI 走的生成器是两套实现，
  # 而且从未被真机启动过 —— 拼错模块名只会在运行时炸，而 GUI 宿主（native_gui / native_tui）
  # 日常 CI 根本碰不到。这里把它变成一道常规门禁。
  module-order:
    name: Module order (CLI + GUI)
    runs-on: windows-latest
    timeout-minutes: 25
    env:
      PYTHONIOENCODING: utf-8
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - uses: ./.github/actions/setup-test-env
      - name: Build jcc and the GUI session probe
        shell: pwsh
        run: |
          dotnet build modules/apps/cli/JoinCode.csproj -c Debug --nologo
          dotnet build non_deliverables_tools/gui_session_probe/GuiSessionProbe.csproj -c Debug --nologo
      - name: Verify CLI module order against modules.yaml
        shell: pwsh
        run: python non_deliverables_tools/scripts/Verify-ExplicitOrder.py
      - name: Verify node contracts and declaration↔factory consistency
        shell: pwsh
        run: python non_deliverables_tools/scripts/Verify-NodeConsistency.py
      # 工具组三方一致：cli_groups.yaml ↔ ToolGroupDeclaration ↔ base.yaml。
      # 缺这一步的后果是「profile 声明了一个永不存在的组」或「某个组永远关不掉」，
      # 而两种情况在 --dump-nodes 里都只是少一行/多一行，人眼很难发现。
      # --live 追加真机交叉核对：静态解析 / `tool tree` / 提示词的组目录必须是同一组数字。
      # 这三者取信于不同的 profile 来源，S7 实测过一次「tool tree 8 组、prompt 13 组」的错位。
      - name: Verify tool group ids across yaml / declaration / profile
        shell: pwsh
        run: python non_deliverables_tools/scripts/Verify-ToolGroupNodes.py --live=artifacts/bin/JoinCode/Debug/net10.0
      - name: Verify GUI session boots with the declared order
        shell: pwsh
        run: |
          $env:JCC_DEBUGLOG = "1"
          $env:JCC_ALLOW_DIRECT_FALLBACK = "1"
          $env:OPENAI_API_KEY = "sk-dummy-probe"
          & "artifacts/bin/GuiSessionProbe/Debug/net10.0/GuiSessionProbe.exe"
          if ($LASTEXITCODE -ne 0) { throw "GUI 会话探针失败 — gui profile 的装配路径走不通" }

  # 「声明 vs 现实」完整对账：编译 13 个分组 exe，逐个比 --list-local 自报数量与 local id 集合、
  # -h 体积上限、单工具 -h 能否定位到参数表，并抽样真跑 6 个无副作用工具。
  #
  # 不接这一步的两个盲区（都是声明侧看不见的）：
  #   ① node.yaml 写着 mode: local，exe 里却根本没实现（或反之）——数量对不上能发现，
  #      A 从 local 换到 host、B 从 host 换到 local 这种「等量互换」只有比 id 集合才发现；
  #   ② 分组 exe 编译不过。声明侧只读 yaml，源码写崩了它照样绿。
  #
  # -FromScratch 是给干净容器准备的：脚本默认走 --no-restore + BuildProjectReferences=false
  # 的快路径，那是为「依赖产物已就绪」的本地增量场景，CI 里没有 assets 文件也没有契约层 DLL。
  tool-node-reality:
    name: Tool Nodes - reality
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      PYTHONIOENCODING: utf-8
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - uses: ./.github/actions/setup-test-env
      - name: Verify each group exe against its declaration
        shell: pwsh
        run: pwsh -ExecutionPolicy Bypass -File non_deliverables_tools/scripts/Verify-ToolNodes.ps1 -FromScratch -Sample
      # 参数名归一化必须两条路径一致：同一个 --filePath，宿主路径被自动修复、exe 路径也应被修复。
      # 分叉的后果是调用方（尤其是模型）无从判断该用哪种写法，只能逐个试错。
      - name: Verify parameter name normalization is identical on host and exe paths
        shell: pwsh
        run: python non_deliverables_tools/scripts/Verify-ToolParamNames.py --per-group 6

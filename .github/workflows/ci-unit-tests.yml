name: CI Unit Tests

on:
  workflow_call:

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  DOTNET_NOLOGO: true
  NUGET_XMLDOC_MODE: skip
  NUGET_PACKAGES: ${{ github.workspace }}/.nuget/packages
  Configuration: Release

jobs:
  unit-tests:
    name: Unit - ${{ matrix.name }}
    runs-on: windows-latest
    timeout-minutes: 8
    strategy:
      fail-fast: false
      matrix:
        include:
          # Foundation
          - name: AsyncLock
            csproj: 01_shared/shared_async_lock/tests/unit/AsyncLock.Tests.csproj
          - name: Structura
            csproj: 01_shared/shared_structura/tests/unit/Structura.Tests.csproj
          # Generators
          - name: AotSafety
            csproj: 00_generators/aot_safety.generator/tests/AotSafety.Tests.csproj
          - name: FsmGenerator
            csproj: 00_generators/fsm.generator/tests/Fsm.Generator.Tests.csproj
          # Infrastructure
          - name: InfraIO
            csproj: tests/unit/infra.tests/io/Infra.IO.Tests.csproj
          - name: InfraServices
            csproj: tests/unit/infra.tests/services/Infra.Services.Tests.csproj
          - name: InfraUtils
            csproj: tests/unit/infra.tests/utils/Infra.Utils.Tests.csproj
          # Core - AI
          - name: Llm
            csproj: 02_llm/llm/tests/unit/Llm.Tests.csproj
          - name: Agents
            csproj: 02_llm/agents/tests/unit/Agents.Tests.csproj
          - name: Reasoning
            csproj: 02_llm/reasoning/tests/unit/Reasoning.Tests.csproj
          # Core - Execution
          - name: BrainPrompts
            csproj: 08_brain/tests/Prompts/Brain.Prompts.Tests.csproj
          - name: BrainContext
            csproj: 08_brain/tests/context/Brain.Context.Tests.csproj
          - name: BrainOther
            csproj: 08_brain/tests/other/Brain.Other.Tests.csproj
          - name: HandsToolHandlers
            csproj: 03_builtin/tests/tool_handlers/Hands.ToolHandlers.Tests.csproj
          - name: HandsSkills
            csproj: 03_builtin/tests/skills/Hands.Skills.Tests.csproj
          - name: HandsShell
            csproj: 03_builtin/tests/shell/Hands.Shell.Tests.csproj
          - name: HandsApi
            csproj: 03_builtin/tests/api/Hands.Api.Tests.csproj
          - name: Scheduling
            csproj: 01_shared/shared_scheduling/tests/unit/Scheduling.Tests.csproj
          - name: McpToolDispatch
            csproj: 04_mcp_dispatch/tests/unit/McpToolDispatch.Tests.csproj
          # Core - Search
          - name: CodeIndex
            csproj: 05_server_codeindex/tests/unit/CodeIndex.Tests.csproj
          - name: Browser
            csproj: 05_server_browser/tests/unit/Browser.Tests.csproj
          # Core - Safety
          - name: GuardSecurity
            csproj: 01_shared/shared_guard/tests/security/Guard.Security.Tests.csproj
          - name: GuardHooks
            csproj: 01_shared/shared_guard/tests/hooks/Guard.Hooks.Tests.csproj
          - name: GuardConfig
            csproj: 01_shared/shared_guard/tests/config/Guard.Config.Tests.csproj
          - name: VaultOther
            csproj: 01_shared/shared_vault/tests/other/Vault.Other.Tests.csproj
          - name: VaultMemdir
            csproj: 01_shared/shared_vault/tests/memdir/Vault.Memdir.Tests.csproj
          # Services
          - name: Mcp
            csproj: 04_mcp_service/tests/unit/Mcp.Tests.csproj
          - name: Dream
            csproj: 05_server_dream/tests/unit/Dream.Tests.csproj
          - name: Eyes
            csproj: 05_server_eyes/tests/unit/Eyes.Tests.csproj
          - name: Bridge
            csproj: 05_server_bridge/tests/unit/Bridge.Tests.csproj
          - name: Vision
            csproj: 05_server_vision/tests/unit/Vision.Tests.csproj
          # Composition
          - name: Composition
            csproj: 08_composition/tests/unit/Composition.Tests.csproj
          - name: Clock
            csproj: 01_shared/shared_clock/tests/unit/Clock.Tests.csproj
          # App / Cross-layer
          - name: Host
            csproj: tests/unit/host.tests/Host.Tests.csproj
          - name: Abs
            csproj: tests/unit/abs.tests/Abs.Tests.csproj
          - name: HandsGoal
            csproj: tests/unit/hands.tests/Hands.Tests.csproj
          - name: McpIntervention
            csproj: tests/unit/mcp.tests/Mcp.UniqueTests.csproj
          - name: McpToolDispatchHealth
            csproj: tests/unit/mcp_tool_dispatch.tests/McpToolDispatch.UniqueTests.csproj
          # MockServer
          - name: MockServerCore
            csproj: tests/mock_servers/mock_server.core.tests/MockServer.Core.Tests.csproj
          # GUI / TUI
          - name: JoinCodeGui
            csproj: tests/unit/join_code_gui.tests/JoinCodeGui.Tests.csproj
            build_first: true
          - name: Tui
            csproj: tests/unit/tui.tests/Tui.Tests.csproj

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - uses: ./.github/actions/setup-test-env
      - name: Test - ${{ matrix.name }}
        run: >
          dotnet test ${{ matrix.csproj }}
          -c Release ${{ matrix.build_first != true && '--no-build' || '' }} --nologo
          --filter "Category!=Integration&Category!=Benchmark"
          --logger "console;verbosity=detailed"
          --logger "trx;LogFileName=${{ matrix.name }}.trx"
      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: unit-test-results-${{ matrix.name }}
          path: '**/${{ matrix.name }}.trx'
          retention-days: 7

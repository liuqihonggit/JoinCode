name: CI Unit Tests

on:
  workflow_call:

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  DOTNET_NOLOGO: true
  NUGET_XMLDOC_MODE: skip
  NUGET_PACKAGES: ${{ github.workspace }}/.nuget/packages
  Configuration: Debug

jobs:
  unit-tests:
    name: Unit - ${{ matrix.domain }}
    runs-on: ${{ matrix.os || 'ubuntu-24.04' }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - domain: generators
            csprojs: modules/generators/aot_safety.tests/AotSafety.Tests.csproj modules/generators/fsm.generator.tests/Fsm.Generator.Tests.csproj
          - domain: collections
            csprojs: modules/collections/structura.tests/Structura.Tests.csproj
          - domain: async_primitives
            csprojs: modules/async_primitives/async_lock.tests/AsyncLock.Tests.csproj modules/async_primitives/bcl_bridge.tests/JoinCode.BclBridge.Tests.csproj modules/async_primitives/transport.impl.tests/Transport.Impl.Tests.csproj
          - domain: abstractions
            csprojs: test/unit/infra.tests/io/Infra.IO.Tests.csproj test/unit/infra.tests/services/Infra.Services.Tests.csproj test/unit/infra.tests/utils/Infra.Utils.Tests.csproj test/unit/abs.tests/Abs.Tests.csproj
          - domain: guard
            csprojs: modules/guard/guard.config.tests/Guard.Config.Tests.csproj modules/guard/guard.hooks.tests/Guard.Hooks.Tests.csproj modules/guard/guard.security.tests/Guard.Security.Tests.csproj
          - domain: storage
            csprojs: modules/storage/clock.tests/Clock.Tests.csproj modules/storage/downloader.tests/Downloader.Tests.csproj modules/storage/scheduling.tests/Scheduling.Tests.csproj modules/storage/vault.memdir.tests/Vault.Memdir.Tests.csproj modules/storage/vault.other.tests/Vault.Other.Tests.csproj
          - domain: plugins
            csprojs: modules/plugins/plugins.tests/Plugins.Tests.csproj
          - domain: mcp
            csprojs: modules/mcp/mcp.tests/Mcp.Tests.csproj modules/mcp/mcp_tool_dispatch.tests/McpToolDispatch.Tests.csproj test/unit/mcp.tests/Mcp.UniqueTests.csproj test/unit/mcp_tool_dispatch.tests/McpToolDispatch.UniqueTests.csproj
          - domain: llm
            csprojs: modules/llm/llm.tests/Llm.Tests.csproj modules/llm/agents.tests/Agents.Tests.csproj modules/llm/reasoning.tests/Reasoning.Tests.csproj
          - domain: cognition
            csprojs: modules/cognition/brain.context.tests/Brain.Context.Tests.csproj modules/cognition/brain.other.tests/Brain.Other.Tests.csproj modules/cognition/brain.prompts.tests/Brain.Prompts.Tests.csproj modules/cognition/hands.api.tests/Hands.Api.Tests.csproj modules/cognition/hands.shell.tests/Hands.Shell.Tests.csproj modules/cognition/hands.skills.tests/Hands.Skills.Tests.csproj modules/cognition/hands.tool_handlers.tests/Hands.ToolHandlers.Tests.csproj test/unit/hands.tests/Hands.Tests.csproj
          - domain: perception
            csprojs: modules/perception/code_index.tests/CodeIndex.Tests.csproj modules/perception/eyes.tests/Eyes.Tests.csproj modules/perception/vision.tests/Vision.Tests.csproj
          - domain: services
            csprojs: modules/services/bridge.tests/Bridge.Tests.csproj modules/services/browser.tests/Browser.Tests.csproj modules/services/dream.tests/Dream.Tests.csproj test/mock/mock_server.core.tests/MockServer.Core.Tests.csproj
          - domain: composition
            csprojs: modules/composition/composition.tests/Composition.Tests.csproj modules/composition/pipelines.tests/Pipelines.Tests.csproj
          - domain: apps
            # Host.Tests（CLI 侧）跨平台，ubuntu 跑
            csprojs: test/unit/host.tests/Host.Tests.csproj
          - domain: gui-core
            # GUI 协议核心（ADR 0145 B3）：纯 net10.0 零 Avalonia/WebView2 — ubuntu 可跑，windows job 收窄
            os: ubuntu-latest
            csprojs: native_gui/tests/native_gui.core.tests/NativeGui.Core.Tests.csproj
          - domain: gui-host
            # GUI 宿主表现层：CsWinRT 投影工具链（Windows PE）+ WebView2 仅 Windows 原生可跑
            os: windows-latest
            csprojs: native_gui/tests/native_gui.host.tests/NativeGui.Host.Tests.csproj

    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - uses: ./.github/actions/setup-test-env
      - name: Test - ${{ matrix.domain }}
        shell: bash
        run: |
          set -e
          # 先编译所有项目（共享依赖只编译一次，增量编译跳过已编译项目）
          for proj in ${{ matrix.csprojs }}; do
            echo "=== Building: $proj ==="
            dotnet build "$proj" -c Debug --nologo \
              -p:UsePackedComponents=true \
              -p:JccAnalyzers=false -p:EnableNETAnalyzers=false -p:AnalysisLevel=none
          done
          # 用 --no-build 运行测试（复用编译产物）
          for proj in ${{ matrix.csprojs }}; do
            name=$(basename "$proj" .csproj)
            echo "=== Testing: $proj ==="
            dotnet test "$proj" -c Debug --nologo --no-build \
              -p:UsePackedComponents=true \
              -p:JccAnalyzers=false -p:EnableNETAnalyzers=false -p:AnalysisLevel=none \
              --filter "Category!=Integration&Category!=Benchmark" \
              --logger "console;verbosity=normal" \
              --logger "trx;LogFileName=$name.trx"
          done
      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: unit-test-results-${{ matrix.domain }}
          path: '**/*.trx'
          retention-days: 7

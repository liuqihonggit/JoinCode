name: CI Unit Tests

on:
  workflow_call:

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  DOTNET_NOLOGO: true
  NUGET_XMLDOC_MODE: skip
  NUGET_PACKAGES: ${{ github.workspace }}/.nuget/packages
  Configuration: Release

jobs:
  unit-tests:
    name: Unit - ${{ matrix.name }}
    runs-on: windows-latest
    timeout-minutes: 8
    strategy:
      fail-fast: false
      matrix:
        include:
          # Foundation
          - name: AsyncLock
            csproj: lib/async_lock.tests/AsyncLock.Tests.csproj
          - name: Structura
            csproj: lib/structura.tests/Structura.Tests.csproj
          # Generators
          - name: AotSafety
            csproj: gen/aot_safety.tests/AotSafety.Tests.csproj
          - name: FsmGenerator
            csproj: gen/fsm.generator.tests/Fsm.Generator.Tests.csproj
          # Infrastructure
          - name: InfraIO
            csproj: tests/unit/infra.tests/io/Infra.IO.Tests.csproj
          - name: InfraServices
            csproj: tests/unit/infra.tests/services/Infra.Services.Tests.csproj
          - name: InfraUtils
            csproj: tests/unit/infra.tests/utils/Infra.Utils.Tests.csproj
          # Core - AI
          - name: Llm
            csproj: llm/llm.tests/Llm.Tests.csproj
          - name: Agents
            csproj: llm/agents.tests/Agents.Tests.csproj
          - name: Reasoning
            csproj: llm/reasoning.tests/Reasoning.Tests.csproj
          # Core - Execution
          - name: BrainPrompts
            csproj: kit/brain.prompts.tests/Brain.Prompts.Tests.csproj
          - name: BrainContext
            csproj: kit/brain.context.tests/Brain.Context.Tests.csproj
          - name: BrainOther
            csproj: kit/brain.other.tests/Brain.Other.Tests.csproj
          - name: HandsToolHandlers
            csproj: kit/hands.tool_handlers.tests/Hands.ToolHandlers.Tests.csproj
          - name: HandsSkills
            csproj: kit/hands.skills.tests/Hands.Skills.Tests.csproj
          - name: HandsShell
            csproj: kit/hands.shell.tests/Hands.Shell.Tests.csproj
          - name: HandsApi
            csproj: kit/hands.api.tests/Hands.Api.Tests.csproj
          - name: Scheduling
            csproj: lib/scheduling.tests/Scheduling.Tests.csproj
          - name: McpToolDispatch
            csproj: kit/mcp_tool_dispatch.tests/McpToolDispatch.Tests.csproj
          # Core - Search
          - name: CodeIndex
            csproj: server/code_index.tests/CodeIndex.Tests.csproj
          - name: Browser
            csproj: server/browser.tests/Browser.Tests.csproj
          # Core - Safety
          - name: GuardSecurity
            csproj: lib/guard.security.tests/Guard.Security.Tests.csproj
          - name: GuardHooks
            csproj: lib/guard.hooks.tests/Guard.Hooks.Tests.csproj
          - name: GuardConfig
            csproj: lib/guard.config.tests/Guard.Config.Tests.csproj
          - name: VaultOther
            csproj: lib/vault.other.tests/Vault.Other.Tests.csproj
          - name: VaultMemdir
            csproj: lib/vault.memdir.tests/Vault.Memdir.Tests.csproj
          # Services
          - name: Mcp
            csproj: kit/mcp.tests/Mcp.Tests.csproj
          - name: Dream
            csproj: server/dream.tests/Dream.Tests.csproj
          - name: Eyes
            csproj: server/eyes.tests/Eyes.Tests.csproj
          - name: Bridge
            csproj: server/bridge.tests/Bridge.Tests.csproj
          - name: Vision
            csproj: server/vision.tests/Vision.Tests.csproj
          # Composition
          - name: Composition
            csproj: kit/composition.tests/Composition.Tests.csproj
          - name: Clock
            csproj: lib/clock.tests/Clock.Tests.csproj
          # App / Cross-layer
          - name: Host
            csproj: tests/unit/host.tests/Host.Tests.csproj
          - name: Abs
            csproj: tests/unit/abs.tests/Abs.Tests.csproj
          - name: HandsGoal
            csproj: tests/unit/hands.tests/Hands.Tests.csproj
          - name: McpIntervention
            csproj: tests/unit/mcp.tests/Mcp.UniqueTests.csproj
          - name: McpToolDispatchHealth
            csproj: tests/unit/mcp_tool_dispatch.tests/McpToolDispatch.UniqueTests.csproj
          # MockServer
          - name: MockServerCore
            csproj: test/mock/mock_server.core.tests/MockServer.Core.Tests.csproj
          # GUI / TUI
          - name: JoinCodeGui
            csproj: tests/unit/join_code_gui.tests/JoinCodeGui.Tests.csproj
            build_first: true
          - name: Tui
            csproj: tests/unit/tui.tests/Tui.Tests.csproj

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - uses: ./.github/actions/setup-test-env
      - name: Test - ${{ matrix.name }}
        run: >
          dotnet test ${{ matrix.csproj }}
          -c Release ${{ matrix.build_first != true && '--no-build' || '' }} --nologo
          --filter "Category!=Integration&Category!=Benchmark"
          --logger "console;verbosity=detailed"
          --logger "trx;LogFileName=${{ matrix.name }}.trx"
      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: unit-test-results-${{ matrix.name }}
          path: '**/${{ matrix.name }}.trx'
          retention-days: 7

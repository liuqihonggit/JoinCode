name: CI Unit Tests

on:
  workflow_call:

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  DOTNET_NOLOGO: true
  NUGET_XMLDOC_MODE: skip
  NUGET_PACKAGES: ${{ github.workspace }}/.nuget/packages
  Configuration: Debug

jobs:
  unit-tests:
    name: Unit - ${{ matrix.name }}
    runs-on: windows-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Foundation
            csprojs: lib/async_lock.tests/AsyncLock.Tests.csproj lib/structura.tests/Structura.Tests.csproj gen/aot_safety.tests/AotSafety.Tests.csproj gen/fsm.generator.tests/Fsm.Generator.Tests.csproj
          - name: Infrastructure
            csprojs: test/unit/infra.tests/io/Infra.IO.Tests.csproj test/unit/infra.tests/services/Infra.Services.Tests.csproj test/unit/infra.tests/utils/Infra.Utils.Tests.csproj lib/downloader.tests/Downloader.Tests.csproj
          - name: CoreAI
            csprojs: llm/llm.tests/Llm.Tests.csproj llm/agents.tests/Agents.Tests.csproj llm/reasoning.tests/Reasoning.Tests.csproj kit/brain.prompts.tests/Brain.Prompts.Tests.csproj kit/brain.context.tests/Brain.Context.Tests.csproj kit/brain.other.tests/Brain.Other.Tests.csproj
          - name: CoreExec
            csprojs: kit/hands.tool_handlers.tests/Hands.ToolHandlers.Tests.csproj kit/hands.skills.tests/Hands.Skills.Tests.csproj kit/hands.shell.tests/Hands.Shell.Tests.csproj kit/hands.api.tests/Hands.Api.Tests.csproj lib/scheduling.tests/Scheduling.Tests.csproj kit/mcp_tool_dispatch.tests/McpToolDispatch.Tests.csproj server/code_index.tests/CodeIndex.Tests.csproj
          - name: Safety
            csprojs: lib/guard.security.tests/Guard.Security.Tests.csproj lib/guard.hooks.tests/Guard.Hooks.Tests.csproj lib/guard.config.tests/Guard.Config.Tests.csproj lib/vault.other.tests/Vault.Other.Tests.csproj lib/vault.memdir.tests/Vault.Memdir.Tests.csproj server/browser.tests/Browser.Tests.csproj lib/clock.tests/Clock.Tests.csproj
          - name: Services
            csprojs: kit/mcp.tests/Mcp.Tests.csproj server/dream.tests/Dream.Tests.csproj server/eyes.tests/Eyes.Tests.csproj server/bridge.tests/Bridge.Tests.csproj server/vision.tests/Vision.Tests.csproj kit/composition.tests/Composition.Tests.csproj
          - name: App
            csprojs: test/unit/host.tests/Host.Tests.csproj test/unit/abs.tests/Abs.Tests.csproj test/unit/hands.tests/Hands.Tests.csproj test/unit/mcp.tests/Mcp.UniqueTests.csproj test/unit/mcp_tool_dispatch.tests/McpToolDispatch.UniqueTests.csproj test/mock/mock_server.core.tests/MockServer.Core.Tests.csproj

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - uses: ./.github/actions/setup-test-env
      - name: Restore - ${{ matrix.name }}
        shell: pwsh
        run: |
          $projects = '${{ matrix.csprojs }}' -split ' '
          foreach ($proj in $projects) {
              Write-Host "Restoring: $proj"
              & dotnet restore $proj --nologo `
                /p:UsePackedComponents=true `
                /p:JccAnalyzers=false /p:EnableNETAnalyzers=false /p:AnalysisLevel=none 2>&1 | Out-Host
              if ($LASTEXITCODE -ne 0) { throw "Restore FAILED: $proj" }
          }
      - name: Test - ${{ matrix.name }}
        shell: pwsh
        run: |
          $projects = '${{ matrix.csprojs }}' -split ' '
          $projects | ForEach-Object -Parallel {
              $proj = $_
              $name = [System.IO.Path]::GetFileNameWithoutExtension($proj)
              & dotnet test $proj -c Debug --nologo --no-restore `
                /p:UsePackedComponents=true `
                /p:JccAnalyzers=false /p:EnableNETAnalyzers=false /p:AnalysisLevel=none `
                --filter "Category!=Integration&Category!=Benchmark" `
                --logger "console;verbosity=normal" `
                --logger "trx;LogFileName=$name.trx" 2>&1 | Out-Host
              if ($LASTEXITCODE -ne 0) {
                  throw "Test FAILED: $proj"
              }
          } -ThrottleLimit 4
      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: unit-test-results-${{ matrix.name }}
          path: '**/*.trx'
          retention-days: 7

name: CI/CD

on:
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  detect:
    runs-on: ubuntu-24.04
    outputs:
      non-docs: ${{ steps.detect.outputs.non-docs }}
      contract: ${{ steps.detect.outputs.contract }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - id: detect
        run: |
          BASE="${{ github.event.pull_request.base.sha }}"
          HEAD="${{ github.event.pull_request.head.sha }}"
          FILES=$(git diff --name-only "$BASE" "$HEAD")
          NON_DOCS=$(echo "$FILES" | grep -vE '\.(md|txt)$|^\.xxx/|^LICENSE$' || true)
          if [ -n "$NON_DOCS" ]; then
            echo "non-docs=true" >> "$GITHUB_OUTPUT"
            echo "📋 代码改动，跑全量 CI"
          else
            echo "non-docs=false" >> "$GITHUB_OUTPUT"
            echo "📄 纯文档改动，跳过全量 CI"
          fi
          # 契约面 = 接口/模型层/构建属性。这类改动会让「所有实现方」的签名约束变化，
          # 而按域测试 job 各编各的，一次漂移会同时红 9 个 job（PR #723）。命中则加跑全量编译。
          # 注意：目录名不是裸 `interfaces/`/`models/`，本仓实际是
          # `abstractions_primitives_interfaces`/`abstractions_primitives_models`/`abstractions_models`…
          # 所以按「路径段名里含 interfaces|models」匹配；只写 `[./](interfaces|models)/` 会漏掉
          # 最关键的 primitives 两个项目（PR #729 实测：改了 IEventConsumer 却没触发本 job）。
          CONTRACT=$(echo "$FILES" | grep -E '(^|/)[^/]*(interfaces|models)[^/]*/|(^|/)Directory\.Build\.(props|targets)$' || true)
          if [ -n "$CONTRACT" ]; then
            echo "contract=true" >> "$GITHUB_OUTPUT"
            echo "🔌 契约面改动，追加全量编译（含 test/ 实现方）："
            echo "$CONTRACT" | head -20
          else
            echo "contract=false" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: detect
    if: needs.detect.outputs.non-docs == 'true'
    uses: ./.github/workflows/ci-build.yml
    with:
      contract-changed: ${{ needs.detect.outputs.contract }}

  architecture:
    needs: detect
    if: needs.detect.outputs.non-docs == 'true'
    uses: ./.github/workflows/ci-architecture.yml

  unit-tests:
    needs: [detect, build]
    if: needs.detect.outputs.non-docs == 'true'
    uses: ./.github/workflows/ci-unit-tests.yml

  integration:
    needs: [detect, build]
    if: needs.detect.outputs.non-docs == 'true'
    uses: ./.github/workflows/ci-integration.yml

  e2e:
    needs: [detect, build]
    if: needs.detect.outputs.non-docs == 'true'
    uses: ./.github/workflows/ci-e2e.yml

name: Daily AOT & RTR Publish

on:
  schedule:
    - cron: '0 8 */2 * *'
  workflow_dispatch:

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  DOTNET_NOLOGO: true
  NUGET_XMLDOC_MODE: skip
  NUGET_PACKAGES: ${{ github.workspace }}/.nuget/packages
  Configuration: Release

jobs:
  publish:
    name: Publish (${{ matrix.project.name }})
    runs-on: windows-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        project:
          - { name: 'jcc-aot', path: 'modules/apps/cli/JoinCode.csproj', artifact: 'jcc-aot', mode: 'aot' }
          - { name: 'jccgui-aot', path: 'native_gui/apps/NativeGui.Host/NativeGui.Host.csproj', artifact: 'jccgui-aot', mode: 'aot' }
          - { name: 'jcc-rtr', path: 'modules/apps/cli/JoinCode.csproj', artifact: 'jcc-rtr', mode: 'rtr' }

    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: 'global.json'

      - name: Cache NuGet Packages
        uses: actions/cache@v5
        with:
          path: ${{ github.workspace }}/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', 'Directory.Build.props') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      - name: Publish (${{ matrix.project.name }}) - ${{ matrix.project.mode == 'aot' && 'NativeAOT' || 'ReadyToRun' }}
        run: |
          if ('${{ matrix.project.mode }}' -eq 'rtr') {
            dotnet publish ${{ matrix.project.path }} `
              -c Release `
              -r win-x64 `
              -o publish/${{ matrix.project.name }} `
              --nologo `
              /p:SkipLocalPack=true `
              /p:SelfContained=true `
              /p:PublishReadyToRun=true `
              /p:PublishReadyToRunComposite=true
          } else {
            dotnet publish ${{ matrix.project.path }} `
              -c Release `
              -r win-x64 `
              -o publish/${{ matrix.project.name }} `
              --nologo `
              /p:SkipLocalPack=true `
              /p:SelfContained=true
          }
          if ($LASTEXITCODE -ne 0) { exit 1 }
        shell: pwsh

      - name: Clean debug artifacts
        run: |
          Get-ChildItem publish/${{ matrix.project.name }} -Include "*.pdb","*.xml" -Recurse | Remove-Item -Force
        shell: pwsh

      - name: Show output info
        run: |
          $dir = "publish/${{ matrix.project.name }}"
          if (Test-Path $dir) {
            $totalSizeMB = [math]::Round((Get-ChildItem $dir -Recurse | Measure-Object -Property Length -Sum).Sum / 1MB, 2)
            $fileCount = (Get-ChildItem $dir -File -Recurse).Count
            Write-Host "${{ matrix.project.name }}: $totalSizeMB MB ($fileCount files)"
            Get-ChildItem $dir -Filter "*.exe" | ForEach-Object {
              $sizeMB = [math]::Round($_.Length / 1MB, 2)
              Write-Host "  $($_.Name): $sizeMB MB"
            }
          }
        shell: pwsh

      # G7 (TASK097): AOT/RTR 产物启动验证 — 证明 NativeAOT 下节点继承链、G4 metadata、
      # G6 经验命令都真实可用（本机无 Windows SDK 链接库 advapi32.lib，真机 AOT 验证只能在此完成）。
      - name: Verify published exe (--dump-nodes / experience)
        if: matrix.project.name != 'jccgui-aot'
        run: |
          $dir = "publish/${{ matrix.project.name }}"
          $exe = (Get-ChildItem $dir -Filter "jcc*.exe" -File | Select-Object -First 1).FullName
          if (-not $exe) { Write-Error "AOT 产物目录 $dir 缺少 jcc*.exe"; exit 1 }
          Write-Host "=== AOT/RTR 产物启动验证: $exe ==="

          # 1. 节点自动归纳（G5）+ G4 metadata：base profile 应带注入的 meta 值
          $dump = & $exe --dump-nodes 2>&1 | Out-String
          if ($LASTEXITCODE -ne 0) { Write-Error "--dump-nodes 退出码 $LASTEXITCODE"; exit 1 }
          if ($dump -notmatch 'stream-rate-limit-mw') { Write-Error "--dump-nodes 未输出限流节点"; exit 1 }
          if ($dump -notmatch 'v=2\.1\.0') { Write-Error "--dump-nodes 未显示 G4 配置注入的 metadata v=2.1.0"; exit 1 }
          Write-Host "  [OK] --dump-nodes: 节点归纳 + G4 metadata 注入正常"

          # 2. G6 经验命令在 AOT 下可用（H₀ 基线 = 30）
          $round = & $exe experience round 2>&1 | Out-String
          if ($LASTEXITCODE -ne 0) { Write-Error "experience round 退出码 $LASTEXITCODE"; exit 1 }
          if ($round -notmatch 'H₀' -or $round -notmatch 'max-requests=30') {
            Write-Error "experience round 未回到 H₀ 基线: $round"; exit 1
          }
          Write-Host "  [OK] experience round: G6 H₀ 重置红线在 AOT 下成立"

          # 3. TASK098 融合：Probe 行为门禁在 AOT 下可用（真实限流器 → H₀ allow=30/60）
          $probe = & $exe probe 2>&1 | Out-String
          if ($LASTEXITCODE -ne 0) { Write-Error "probe 退出码 $LASTEXITCODE"; exit 1 }
          if ($probe -notmatch 'allow=30' -or $probe -notmatch 'deny=30') {
            Write-Error "probe 未产出 H₀ 真实行为指纹: $probe"; exit 1
          }
          Write-Host "  [OK] probe: TASK098 行为门禁在 AOT 下产出真实限流指纹"

          # 4. 635 工具零回归
          $tree = & $exe tool tree 2>&1 | Out-String
          if ($tree -notmatch '635') { Write-Error "tool tree 未报告 635 工具: $tree"; exit 1 }
          Write-Host "  [OK] tool tree: 635 工具零回归"
        shell: pwsh

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.project.artifact }}-${{ github.run_number }}
          path: publish/${{ matrix.project.name }}/
          retention-days: 7
          if-no-files-found: error

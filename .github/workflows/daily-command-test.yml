name: Daily Command Test

# > ADR: [0080](docs/adr/0080-manual-exe-testing-guide.md) — 手动测试 exe 功能(非mock操作)
# 每日定时遍历全部 MCP 工具 + 斜杠命令,全参数填充调用,验证功能正常
# 报告含每个命令耗时,可针对性优化(>30s 的命令需备注,见 ADR 0080)
# 并行架构: MCP工具分3片并行 + 斜杠命令1片, 每片内部ForEach-Object -Parallel并发8

on:
  schedule:
    - cron: '0 20 * * *'
  workflow_dispatch:
    inputs:
      limit:
        description: 'Limit number of tools/commands (0=all)'
        required: false
        default: '0'
        type: string

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  DOTNET_NOLOGO: true
  NUGET_XMLDOC_MODE: skip
  NUGET_PACKAGES: ${{ github.workspace }}/.nuget/packages
  Configuration: Debug

jobs:
  command-test:
    name: ${{ matrix.name }}
    runs-on: windows-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: "MCP Shard 1/3",  test_type: mcp,   shard: 1, total: 3 }
          - { name: "MCP Shard 2/3",  test_type: mcp,   shard: 2, total: 3 }
          - { name: "MCP Shard 3/3",  test_type: mcp,   shard: 3, total: 3 }
          - { name: "Slash Commands", test_type: slash, shard: 1, total: 1 }

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: 'global.json'

      - name: Cache NuGet Packages
        uses: actions/cache@v5
        with:
          path: ${{ github.workspace }}/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', 'Directory.Build.props') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      - name: Build jcc (Debug)
        run: dotnet build app/cli/JoinCode.csproj -c Debug --nologo
        shell: pwsh

      - name: Init jcc settings
        run: |
          $jccDir = Join-Path $HOME ".jcc"
          if (-not (Test-Path $jccDir)) { New-Item -ItemType Directory -Force -Path $jccDir | Out-Null }
          $settings = @'
          {
            "vendor": {
              "sensenova": { "provider": "sensenova", "protocol": "openai-compatible", "model": "sensenova-6.8-flash-lite", "endpoint": "https://token.sensenova.cn/v1", "apiKeyEnvVar": "SENSENOVA_API_KEY", "models": [{"id":"sensenova-6.8-flash-lite","canonicalId":"sensenova-6.8-flash-lite","displayName":"SenseNova 6.8 Flash-Lite","contextWindow":262144}], "modelsEndpoint": "models" },
              "openai": { "provider": "openai", "protocol": "openai-compatible", "model": "gpt-5.6-sol", "endpoint": "https://api.openai.com/v1", "apiKeyEnvVar": "OPENAI_API_KEY", "models": [{"id":"gpt-5.6-sol","canonicalId":"gpt-5.6-sol","displayName":"GPT 5.6 Sol","contextWindow":200000}], "modelsEndpoint": "models" },
              "anthropic": { "provider": "anthropic", "protocol": "anthropic", "model": "claude-opus-5", "endpoint": "https://api.anthropic.com", "apiKeyEnvVar": "ANTHROPIC_API_KEY", "models": [{"id":"claude-opus-5","canonicalId":"claude-opus-5","displayName":"Claude Opus 5","contextWindow":200000}], "modelsEndpoint": "models" },
              "deepseek": { "provider": "deepseek", "protocol": "openai-compatible", "model": "deepseek-v4-flash", "endpoint": "https://api.deepseek.com", "apiKeyEnvVar": "DEEPSEEK_API_KEY", "models": [{"id":"deepseek-v4-flash","canonicalId":"deepseek-v4-flash","displayName":"DeepSeek V4 Flash","contextWindow":128000}], "modelsEndpoint": "models" },
              "agnes": { "provider": "agnes", "protocol": "openai-compatible", "model": "agnes-2.0-flash", "endpoint": "https://apihub.agnes-ai.com/v1", "apiKeyEnvVar": "AGNES_API_KEY", "models": [{"id":"agnes-2.0-flash","canonicalId":"agnes-2.0-flash","displayName":"Agnes 2.0 Flash","contextWindow":128000}], "modelsEndpoint": "models" },
              "zhipu": { "provider": "zhipu", "protocol": "openai-compatible", "model": "glm-5.3", "endpoint": "https://open.bigmodel.cn/api/paas/v4", "apiKeyEnvVar": "ZHIPUAI_API_KEY", "models": [{"id":"glm-5.3","canonicalId":"glm-5.3","displayName":"GLM 5.3","contextWindow":128000}], "modelsEndpoint": "models" }
            },
            "autoFetchModels": false,
            "current": { "profile": "sensenova" }
          }
          '@
          $settingsPath = Join-Path $jccDir "settings.json"
          $settings | Out-File -FilePath $settingsPath -Encoding UTF8
          Write-Host "Created: $settingsPath"
        shell: pwsh

      - name: Run Command Tests
        run: |
          $limit = '${{ github.event.inputs.limit }}'
          if ([string]::IsNullOrWhiteSpace($limit) -or $limit -eq '0') { $limit = '0' }
          $reportName = "command-test-report-${{ matrix.test_type }}-${{ matrix.shard }}.md"
          pwsh -ExecutionPolicy Bypass -File non_deliverables_tools/scripts/Invoke-AllCommandTests.ps1 -TestType ${{ matrix.test_type }} -Shard ${{ matrix.shard }} -TotalShards ${{ matrix.total }} -Concurrency 8 -Limit ([int]$limit) -ReportPath "artifacts/$reportName"
        shell: pwsh

      - name: Upload Report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: command-test-report-${{ matrix.test_type }}-${{ matrix.shard }}-${{ github.run_number }}
          path: artifacts/command-test-report-${{ matrix.test_type }}-${{ matrix.shard }}.md
          retention-days: 30
          if-no-files-found: warn

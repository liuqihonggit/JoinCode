name: Mutation Testing

on:
  workflow_dispatch:
    inputs:
      projects:
        description: 'Projects to test (comma-separated, e.g. Guard,Brain or ALL)'
        required: true
        default: 'ALL'
      concurrency:
        description: 'Parallel test sessions per runner'
        required: false
        default: '8'
        type: choice
        options:
          - '2'
          - '4'
          - '8'
      break_threshold:
        description: 'Break threshold (0=never break, 60=fail if score<60%)'
        required: false
        default: '0'
        type: choice
        options:
          - '0'
          - '40'
          - '60'
          - '80'
  schedule:
    - cron: '0 11 * * 1'

concurrency:
  group: mutation-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  DOTNET_NOLOGO: true
  NUGET_XMLDOC_MODE: skip
  NUGET_PACKAGES: ${{ github.workspace }}/.nuget/packages

jobs:
  prepare:
    name: Prepare
    runs-on: ubuntu-24.04
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    outputs:
      matrix: ${{ steps.set.outputs.matrix }}
    steps:
      - name: Build matrix
        id: set
        run: |
          ALL_PROJECTS='["Guard-Config","Guard-Security-ServicesA","Guard-Security-ServicesB","Guard-Security-ServicesC","Guard-Security-ServicesD","Guard-Security-PowerShell","Guard-Security-Other","Guard-Hooks","Vault-Memdir","Vault-Other","Brain-CtxAdmin","Brain-CtxChat","Brain-CtxOther","Brain-CtxNonServicesA","Brain-CtxNonServicesB","Brain-PromptsSections","Brain-PromptsOther","Brain-OtherA","Brain-OtherB","Hands-SysTools","Hands-CoreHandlers","Hands-DevTools","Hands-SkillServices","Hands-SkillBuiltIn","Hands-SkillOther","Hands-Api","Hands-Shell","Scheduling","McpToolDispatch","Llm","Agents","Reasoning","CodeIndex-Parsing","CodeIndex-Indexing","CodeIndex-Rest","Browser","Mcp-Protocol","Mcp-Rest","Eyes","Dream","Bridge-SessionA","Bridge-SessionB","Bridge-Transport","Bridge-CoreRuntime","Bridge-CoreOther","Bridge-Messaging","Bridge-ClientServer","Composition","Clock","Infra-IO-FileOps","Infra-IO-FsAndConfig","Infra-IO-ProcessAndOther","Infra-Utils-TextA1a","Infra-Utils-TextA1b","Infra-Utils-TextA2a","Infra-Utils-TextA2b","Infra-Utils-TextB1","Infra-Utils-TextB2","Infra-Utils-Resilience","Infra-Utils-OtherA1a","Infra-Utils-OtherA1b","Infra-Utils-Validation1","Infra-Utils-Validation2","Infra-Utils-Async","Infra-Utils-Services","Infra-Utils-OtherB","Infra-Services","Host-Commands","Host-Other"]'
          INPUT="${{ github.event.inputs.projects || 'ALL' }}"
          if [ "$INPUT" = "ALL" ]; then
            echo "matrix={\"include\":$(echo $ALL_PROJECTS | jq -c '[.[] | {project: .}]')}" >> $GITHUB_OUTPUT
          else
            EXPANDED=""
            IFS=',' read -ra PARTS <<< "$INPUT"
            for part in "${PARTS[@]}"; do
              trimmed=$(echo "$part" | xargs)
              if [ "$trimmed" = "Guard" ]; then
                EXPANDED="$EXPANDED,{\"project\":\"Guard-Config\"},{\"project\":\"Guard-Security-ServicesA\"},{\"project\":\"Guard-Security-ServicesB\"},{\"project\":\"Guard-Security-ServicesC\"},{\"project\":\"Guard-Security-ServicesD\"},{\"project\":\"Guard-Security-PowerShell\"},{\"project\":\"Guard-Security-Other\"},{\"project\":\"Guard-Hooks\"}"
              elif [ "$trimmed" = "Vault" ]; then
                EXPANDED="$EXPANDED,{\"project\":\"Vault-Memdir\"},{\"project\":\"Vault-Other\"}"
              elif [ "$trimmed" = "Brain" ]; then
                EXPANDED="$EXPANDED,{\"project\":\"Brain-CtxAdmin\"},{\"project\":\"Brain-CtxChat\"},{\"project\":\"Brain-CtxOther\"},{\"project\":\"Brain-CtxNonServicesA\"},{\"project\":\"Brain-CtxNonServicesB\"},{\"project\":\"Brain-PromptsSections\"},{\"project\":\"Brain-PromptsOther\"},{\"project\":\"Brain-OtherA\"},{\"project\":\"Brain-OtherB\"}"
              elif [ "$trimmed" = "Hands" ]; then
                EXPANDED="$EXPANDED,{\"project\":\"Hands-SysTools\"},{\"project\":\"Hands-CoreHandlers\"},{\"project\":\"Hands-DevTools\"},{\"project\":\"Hands-SkillServices\"},{\"project\":\"Hands-SkillBuiltIn\"},{\"project\":\"Hands-SkillOther\"},{\"project\":\"Hands-Api\"},{\"project\":\"Hands-Shell\"}"
              elif [ "$trimmed" = "Mcp" ]; then
                EXPANDED="$EXPANDED,{\"project\":\"Mcp-Protocol\"},{\"project\":\"Mcp-Rest\"}"
              elif [ "$trimmed" = "CodeIndex" ]; then
                EXPANDED="$EXPANDED,{\"project\":\"CodeIndex-Parsing\"},{\"project\":\"CodeIndex-Indexing\"},{\"project\":\"CodeIndex-Rest\"}"
              elif [ "$trimmed" = "Host" ]; then
                EXPANDED="$EXPANDED,{\"project\":\"Host-Commands\"},{\"project\":\"Host-Other\"}"
              elif [ "$trimmed" = "Bridge" ]; then
                EXPANDED="$EXPANDED,{\"project\":\"Bridge-SessionA\"},{\"project\":\"Bridge-SessionB\"},{\"project\":\"Bridge-Transport\"},{\"project\":\"Bridge-CoreRuntime\"},{\"project\":\"Bridge-CoreOther\"},{\"project\":\"Bridge-Messaging\"},{\"project\":\"Bridge-ClientServer\"}"
              elif [ "$trimmed" = "Infra" ]; then
                EXPANDED="$EXPANDED,{\"project\":\"Infra-IO-FileOps\"},{\"project\":\"Infra-IO-FsAndConfig\"},{\"project\":\"Infra-IO-ProcessAndOther\"},{\"project\":\"Infra-Utils-TextA1a\"},{\"project\":\"Infra-Utils-TextA1b\"},{\"project\":\"Infra-Utils-TextA2a\"},{\"project\":\"Infra-Utils-TextA2b\"},{\"project\":\"Infra-Utils-TextB1\"},{\"project\":\"Infra-Utils-TextB2\"},{\"project\":\"Infra-Utils-Resilience\"},{\"project\":\"Infra-Utils-OtherA1a\"},{\"project\":\"Infra-Utils-OtherA1b\"},{\"project\":\"Infra-Utils-Validation1\"},{\"project\":\"Infra-Utils-Validation2\"},{\"project\":\"Infra-Utils-Async\"},{\"project\":\"Infra-Utils-Services\"},{\"project\":\"Infra-Utils-OtherB\"},{\"project\":\"Infra-Services\"}"
              else
                EXPANDED="$EXPANDED,{\"project\":\"$trimmed\"}"
              fi
            done
            EXPANDED="${EXPANDED#,}"
            echo "matrix={\"include\":[$EXPANDED]}" >> $GITHUB_OUTPUT
          fi

  mutation-test:
    name: Stryker - ${{ matrix.project }}
    needs: prepare
    runs-on: windows-latest
    # 30 分钟设计: 目标每个 job ≤30min, +5min 容差; 超时=必须拆分该 job 的变异范围
    timeout-minutes: 35
    strategy:
      matrix: ${{ fromJson(needs.prepare.outputs.matrix) }}
      fail-fast: false
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: 'global.json'

      - name: Install Stryker.NET
        run: dotnet tool install dotnet-stryker --global

      - name: Cache NuGet Packages
        uses: actions/cache@v5
        with:
          path: ${{ github.workspace }}/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', 'Directory.Build.props') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      # 注意: 不预构建全解决方案 — Stryker(-s Stryker.slnx) 自己 restore+build 被测链,
      # 全解决方案 build 每 job 多耗 10-25min 且 build 缓存 key 含全部 .cs 在 daily 场景必 miss

      - name: Run Stryker
        shell: pwsh
        env:
          STRYKER_PROJECT: ${{ matrix.project }}
          STRYKER_CONCURRENCY: ${{ github.event.inputs.concurrency || '8' }}
          STRYKER_BREAK: ${{ github.event.inputs.break_threshold || '0' }}
          VSTEST_CONNECTION_TIMEOUT: 300
          DOTNET_EnableDiagnostics: 0
        run: |
          $projectMap = @{
            'Guard-Config'         = @{ Dir = 'modules\guard\guard.config.tests';   Src = 'Guard.csproj';           Mutate = @('configuration/**','dependency_injection/**','policy/**','o_auth/**') }
            # 30 分钟设计: bash 类测试重(>1s/变异), Guard-Security-Services 拆 A/B/C/D 控制单 job 时长
            # #105 实测: B 拆分后 ~1100 变异 19min 过线; C(readonly_detector 全量 2676 行) 1586 变异纯慢超时 → 再按 Git/NonGit 语义二拆
            # C=Git 侧(GitFlagBuilders+入口+目录+元字符+展开+类型, 1463 行≈869 变异), D=NonGit 侧(NonGitFlagBuilders+校验器, 1213 行≈720 变异)
            'Guard-Security-ServicesA'   = @{ Dir = 'modules\guard\guard.security.tests'; Src = 'Guard.csproj'; Mutate = @('security/services/bash_ast_walker/**','security/services/bash_validation/**') }
            'Guard-Security-ServicesB'   = @{ Dir = 'modules\guard\guard.security.tests'; Src = 'Guard.csproj'; Mutate = @('security/services/classifiers/**','security/services/network_and_misc/**','security/services/path_validation/**') }
            'Guard-Security-ServicesC'   = @{ Dir = 'modules\guard\guard.security.tests'; Src = 'Guard.csproj'; Mutate = @('security/services/readonly_detector/GitFlagBuilders.cs','security/services/readonly_detector/ReadOnlyCommandDetector.cs','security/services/readonly_detector/CommandCatalog.cs','security/services/readonly_detector/ShellMetacharacterDetector.cs','security/services/readonly_detector/ExpansionDetector.cs','security/services/readonly_detector/ReadOnlyCommandTypes.cs') }
            'Guard-Security-ServicesD'   = @{ Dir = 'modules\guard\guard.security.tests'; Src = 'Guard.csproj'; Mutate = @('security/services/readonly_detector/NonGitFlagBuilders.cs','security/services/readonly_detector/FlagValidator.cs','security/services/readonly_detector/RegexValidator.cs','security/services/readonly_detector/IReadOnlyServices.cs') }
            'Guard-Security-PowerShell' = @{ Dir = 'modules\guard\guard.security.tests'; Src = 'Guard.csproj'; Mutate = @('security/power_shell/**') }
            'Guard-Security-Other'      = @{ Dir = 'modules\guard\guard.security.tests'; Src = 'Guard.csproj'; Mutate = @('security/danger_classification/**','security/sandbox/**','security/shell/**','security/scanners/**','security/interceptors/**','security/constants/**') }
            'Guard-Hooks'          = @{ Dir = 'modules\guard\guard.hooks.tests';    Src = 'Guard.csproj';           Mutate = @('hooks/**','permission/**') }
            'Vault-Memdir'         = @{ Dir = 'modules\storage\vault.memdir.tests'; Src = 'Vault.csproj';           Mutate = @('memdir/**') }
            'Vault-Other'          = @{ Dir = 'modules\storage\vault.other.tests';  Src = 'Vault.csproj';           Mutate = @('state/**','todo/**','user_interaction/**','step_evidence/**','notification/**','dependency_injection/**') }
            'Brain-CtxAdmin'       = @{ Dir = 'modules\cognition\brain.context.tests'; Src = 'Brain.csproj';       Mutate = @('context/services/admin/**') }
            'Brain-CtxChat'        = @{ Dir = 'modules\cognition\brain.context.tests'; Src = 'Brain.csproj';       Mutate = @('context/services/chat/**','context/services/chat_init/**') }
            'Brain-CtxOther'       = @{ Dir = 'modules\cognition\brain.context.tests'; Src = 'Brain.csproj';       Mutate = @('context/services/preprocess/**','context/services/context/**','context/services/processor/**','context/services/prompt/**','context/services/idle/**','context/services/loop/**') }
            'Brain-CtxNonServicesA' = @{ Dir = 'modules\cognition\brain.context.tests'; Src = 'Brain.csproj';      Mutate = @('context/compact/**','context/compression/**') }
            'Brain-CtxNonServicesB' = @{ Dir = 'modules\cognition\brain.context.tests'; Src = 'Brain.csproj';      Mutate = @('context/collapse/**','context/core/**','context/resolution/**') }
            'Brain-PromptsSections'= @{ Dir = 'modules\cognition\brain.prompts.tests'; Src = 'Prompts.csproj';     Mutate = @('sections/**') }
            'Brain-PromptsOther'   = @{ Dir = 'modules\cognition\brain.prompts.tests'; Src = 'Prompts.csproj';    Mutate = @('services/**','testing/**','templates/**','utils/**','core/**') }
            'Brain-OtherA'         = @{ Dir = 'modules\cognition\brain.other.tests';  Src = 'Brain.csproj';       Mutate = @('context/**') }
            'Brain-OtherB'         = @{ Dir = 'modules\cognition\brain.other.tests';  Src = 'Brain.csproj';       Mutate = @('query/**','planning/**','cost_tracking/**','context_fold/**','summary/**','cache/**','dependency_injection/**') }
            'Hands-SysTools'       = @{ Dir = 'modules\cognition\hands.tool_handlers.tests'; Src = 'Hands.csproj'; Mutate = @('tool_handlers/system_tools/**') }
            'Hands-CoreHandlers'   = @{ Dir = 'modules\cognition\hands.tool_handlers.tests'; Src = 'Hands.csproj'; Mutate = @('tool_handlers/core/**') }
            'Hands-DevTools'       = @{ Dir = 'modules\cognition\hands.tool_handlers.tests'; Src = 'Hands.csproj'; Mutate = @('tool_handlers/dev_tools/**') }
            'Hands-SkillServices'  = @{ Dir = 'modules\cognition\hands.skills.tests'; Src = 'Hands.csproj';       Mutate = @('skills/services/**','skills/mcp/**','skills/plugin/**') }
            'Hands-SkillBuiltIn'   = @{ Dir = 'modules\cognition\hands.skills.tests'; Src = 'Hands.csproj';       Mutate = @('skills/built_in/**','skills/skills2/**') }
            'Hands-SkillOther'     = @{ Dir = 'modules\cognition\hands.skills.tests'; Src = 'Hands.csproj';       Mutate = @('skills/discovery/**','skills/search/**','skills/utils/**') }
            'Hands-Api'            = @{ Dir = 'modules\cognition\hands.api.tests';    Src = 'Hands.csproj';         Mutate = @('api/**','web/**','network/**','integration/**') }
            'Hands-Shell'          = @{ Dir = 'modules\cognition\hands.shell.tests';  Src = 'Hands.csproj';         Mutate = @('shell/**','system/**','voice/**','notebook/**','serialization/**','build/**','cache/**','dependency_injection/**') }
            'Scheduling'           = @{ Dir = 'modules\storage\scheduling.tests';     Src = 'Scheduling.csproj';      Mutate = @() }
            'McpToolDispatch'      = @{ Dir = 'modules\mcp\mcp_tool_dispatch.tests'; Src = 'McpToolDispatch.csproj'; Mutate = @() }
            'Llm'                  = @{ Dir = 'modules\llm\llm.tests';                Src = 'Llm.csproj';             Mutate = @() }
            'Agents'               = @{ Dir = 'modules\llm\agents.tests';             Src = 'Agents.csproj';          Mutate = @() }
            'Reasoning'            = @{ Dir = 'modules\llm\reasoning.tests';          Src = 'Reasoning.csproj';       Mutate = @() }
            'CodeIndex-Parsing'    = @{ Dir = 'modules\perception\code_index.tests';  Src = 'CodeIndex.csproj';       Mutate = @('parsing/**','query/**','plugins/**') }
            'CodeIndex-Indexing'   = @{ Dir = 'modules\perception\code_index.tests';  Src = 'CodeIndex.csproj';       Mutate = @('indexing/**','incremental/**','graph/**') }
            'CodeIndex-Rest'       = @{ Dir = 'modules\perception\code_index.tests';  Src = 'CodeIndex.csproj';       Mutate = @('!parsing/**','!query/**','!plugins/**','!indexing/**','!incremental/**','!graph/**') }
            'Browser'              = @{ Dir = 'modules\services\browser.tests';       Src = 'Browser.csproj';         Mutate = @() }
            # 30 分钟设计: Mcp 变异量最大(7000+), 拆协议层/其余 控制单 job 时长
            'Mcp-Protocol'         = @{ Dir = 'modules\mcp\mcp.tests';                Src = 'Mcp.csproj';             Mutate = @('mcp_protocol/**','transports/**','communication/**','protocol.contracts/**','remote/**') }
            'Mcp-Rest'             = @{ Dir = 'modules\mcp\mcp.tests';                Src = 'Mcp.csproj';             Mutate = @('!mcp_protocol/**','!transports/**','!communication/**','!protocol.contracts/**','!remote/**') }
            'Eyes'                 = @{ Dir = 'modules\perception\eyes.tests';        Src = 'Eyes.csproj';            Mutate = @() }
            'Dream'                = @{ Dir = 'modules\services\dream.tests';         Src = 'Dream.csproj';            Mutate = @() }
            'Bridge-SessionA'     = @{ Dir = 'modules\services\bridge.tests'; Src = 'Bridge.csproj'; Mutate = @('session/main/**'); Concurrency = 2 }
            'Bridge-SessionB'     = @{ Dir = 'modules\services\bridge.tests'; Src = 'Bridge.csproj'; Mutate = @('session/**','!session/main/**'); Concurrency = 2 }
            'Bridge-Transport'    = @{ Dir = 'modules\services\bridge.tests'; Src = 'Bridge.csproj'; Mutate = @('transport/**'); Concurrency = 2 }
            'Bridge-CoreRuntime'  = @{ Dir = 'modules\services\bridge.tests'; Src = 'Bridge.csproj'; Mutate = @('core/runtime/**'); Concurrency = 2 }
            'Bridge-CoreOther'    = @{ Dir = 'modules\services\bridge.tests'; Src = 'Bridge.csproj'; Mutate = @('core/**','!core/runtime/**'); Concurrency = 2 }
            'Bridge-Messaging'    = @{ Dir = 'modules\services\bridge.tests'; Src = 'Bridge.csproj'; Mutate = @('messaging/**'); Concurrency = 2 }
            'Bridge-ClientServer' = @{ Dir = 'modules\services\bridge.tests'; Src = 'Bridge.csproj'; Mutate = @('client/**','server/**','config/**','security/**'); Concurrency = 2 }
            'Composition'          = @{ Dir = 'modules\composition\composition.tests'; Src = 'Composition.csproj';  Mutate = @() }
            'Clock'                = @{ Dir = 'modules\storage\clock.tests';          Src = 'Clock.csproj';           Mutate = @() }
            'Infra-IO-FileOps'       = @{ Dir = 'test\unit\infra.tests\io';           Src = 'Infrastructure.csproj';      Test = 'Infra.IO.Tests.csproj';      Mutate = @('io/services/file_ops/**') }
            'Infra-IO-FsAndConfig'   = @{ Dir = 'test\unit\infra.tests\io';           Src = 'Infrastructure.csproj';      Test = 'Infra.IO.Tests.csproj';      Mutate = @('io/file_system/**','io/configuration/**','io/services/throttle/**') }
            'Infra-IO-ProcessAndOther' = @{ Dir = 'test\unit\infra.tests\io';         Src = 'Infrastructure.csproj';      Test = 'Infra.IO.Tests.csproj';      Mutate = @('io/process/**','io/console/**','io/services/terminal/**','io/services/diff/**','http/**','process/**','ssh/**','windows/**','shell/**') }
            'Infra-Utils-TextA1a'  = @{ Dir = 'test\unit\infra.tests\utils';          Src = 'Infrastructure.csproj';      Test = 'Infra.Utils.Tests.csproj';   Mutate = @('utils/text/FrontmatterParser.cs') }
            'Infra-Utils-TextA1b'  = @{ Dir = 'test\unit\infra.tests\utils';          Src = 'Infrastructure.csproj';      Test = 'Infra.Utils.Tests.csproj';   Mutate = @('utils/text/MarkdownWalker.cs') }
            'Infra-Utils-TextA2a'  = @{ Dir = 'test\unit\infra.tests\utils';          Src = 'Infrastructure.csproj';      Test = 'Infra.Utils.Tests.csproj';   Mutate = @('utils/text/AhoCorasick.cs') }
            'Infra-Utils-TextA2b'  = @{ Dir = 'test\unit\infra.tests\utils';          Src = 'Infrastructure.csproj';      Test = 'Infra.Utils.Tests.csproj';   Mutate = @('utils/text/DualBufferAhoCorasick.cs') }
            'Infra-Utils-TextB1'   = @{ Dir = 'test\unit\infra.tests\utils';          Src = 'Infrastructure.csproj';      Test = 'Infra.Utils.Tests.csproj';   Mutate = @('utils/text/ErrorMessages.cs','utils/text/DurationFormatter.cs','utils/text/FileSizeFormatter.cs') }
            'Infra-Utils-TextB2'   = @{ Dir = 'test\unit\infra.tests\utils';          Src = 'Infrastructure.csproj';      Test = 'Infra.Utils.Tests.csproj';   Mutate = @('utils/text/GlobMatcher.cs','utils/text/JsonArgumentParser.cs','utils/text/StringBuilderPool.cs') }
            'Infra-Utils-Resilience' = @{ Dir = 'test\unit\infra.tests\utils';          Src = 'Infrastructure.csproj';      Test = 'Infra.Utils.Tests.csproj';   Mutate = @('utils/resilience/**') }
            'Infra-Utils-OtherA1a'  = @{ Dir = 'test\unit\infra.tests\utils'; Src = 'Infrastructure.csproj'; Test = 'Infra.Utils.Tests.csproj'; Mutate = @('housekeeping/**') }
            'Infra-Utils-OtherA1b'  = @{ Dir = 'test\unit\infra.tests\utils'; Src = 'Infrastructure.csproj'; Test = 'Infra.Utils.Tests.csproj'; Mutate = @('cache/**','async_file_lock/**') }
            'Infra-Utils-Validation1' = @{ Dir = 'test\unit\infra.tests\utils'; Src = 'Infrastructure.csproj'; Test = 'Infra.Utils.Tests.csproj'; Mutate = @('utils/validation/ValidationHelper.cs') }
            'Infra-Utils-Validation2' = @{ Dir = 'test\unit\infra.tests\utils'; Src = 'Infrastructure.csproj'; Test = 'Infra.Utils.Tests.csproj'; Mutate = @('utils/validation/ArgumentValidator.cs') }
            'Infra-Utils-Async'      = @{ Dir = 'test\unit\infra.tests\utils'; Src = 'Infrastructure.csproj'; Test = 'Infra.Utils.Tests.csproj'; Mutate = @('utils/diagnostics/**') }
            'Infra-Utils-Services'   = @{ Dir = 'test\unit\infra.tests\utils'; Src = 'Infrastructure.csproj'; Test = 'Infra.Utils.Tests.csproj'; Mutate = @('utils/services/**') }
            'Infra-Utils-OtherB'    = @{ Dir = 'test\unit\infra.tests\utils'; Src = 'Infrastructure.csproj'; Test = 'Infra.Utils.Tests.csproj'; Mutate = @('utils/throttle/**','utils/collections/**','utils/pooling/**','utils/io/**','utils/generation/**','utils/system/**','io/services/persistence/**','configuration/**','time/**','entity_reaper/**','reaper_scheduler/**') }
            'Infra-Services'         = @{ Dir = 'test\unit\infra.tests\services';       Src = 'Infrastructure.csproj';      Test = 'Infra.Services.Tests.csproj'; Mutate = @('localization/**','pipeline/**','network/**','telemetry/**') }
            'Host-Commands'        = @{ Dir = 'test\unit\host.tests';                   Src = 'JoinCode.csproj';        Mutate = @('core/commands/**') }
            'Host-Other'           = @{ Dir = 'test\unit\host.tests';                   Src = 'JoinCode.csproj';        Mutate = @('app/**','adapters/**','entry/**','pipe/**','queue/**','services/**','core/**','!core/commands/**') }
          }

          $name = $env:STRYKER_PROJECT
          $info = $projectMap[$name]
          if (-not $info) { Write-Error "Unknown project: $name"; exit 1 }

          $testDir = Join-Path $env:GITHUB_WORKSPACE $info.Dir
          $concurrency = if ($info.ContainsKey('Concurrency')) { [int]$info.Concurrency } else { [int]$env:STRYKER_CONCURRENCY }
          $breakThreshold = [int]$env:STRYKER_BREAK

          $slnx = 'build/sln/Stryker.slnx'
          $slnxPath = Join-Path $env:GITHUB_WORKSPACE $slnx

          $strykerArgs = @("-p", $info.Src, "-s", $slnxPath, "-c", $concurrency, "-b", $breakThreshold, "--configuration", "Debug", "--threshold-low", "60", "--threshold-high", "80", "-r", "progress", "-r", "html", "-r", "json", "-r", "markdown", "--log-file", "StrykerOutput-debug.log")

          if ($info.ContainsKey('Test') -and $info.Test) {
            $strykerArgs += @("--test-project", $info.Test)
          }

          $strykerArgs += @("--mutate", "!**/GlobalUsings.cs", "--mutate", "!**/AssemblyInfo.cs", "--mutate", "!**/*Options.cs", "--mutate", "!**/*Factory.cs", "--mutate", "!**/I*.cs", "--mutate", "!**/*Constants.cs", "--mutate", "!**/*Exception.cs")
          if ($info.Mutate.Count -gt 0) {
            foreach ($m in $info.Mutate) {
              $strykerArgs += @("--mutate", $m)
            }
          }

          Write-Host "Stryker: $name | Source: $($info.Src) | Dir: $testDir | Slnx: $slnx | Concurrency: $concurrency | Mutate: $($info.Mutate.Count) patterns"

          # Stryker 4.16 的 test-case-filter 只能通过配置文件设置（命令行 N/A）
          # 注意: 此文件会遮蔽上级目录 stryker-config.json,必须携带 additional-timeout 防止变异死锁时测试session无限hang
          # 临时(#106 后挂死定位): verbosity=debug 记录每个 mutant 的测试事件, 挂死前最后一个 mutant 即凶手
          $configPath = Join-Path $testDir "stryker-config.json"
          '{"stryker-config":{"test-case-filter":"Category!=Integration","additional-timeout":5000,"verbosity":"debug"}}' | Out-File -FilePath $configPath -Encoding utf8 -NoNewline

          Push-Location $testDir
          try {
            & dotnet-stryker @strykerArgs
          } finally {
            Pop-Location
            Remove-Item $configPath -Force -ErrorAction SilentlyContinue
          }

      - name: Upload Stryker Reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: stryker-report-${{ matrix.project }}
          path: |
            **/StrykerOutput/**/reports/mutation-report.html
            **/StrykerOutput/**/reports/mutation-report.json

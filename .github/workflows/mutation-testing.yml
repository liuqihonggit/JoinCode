name: Mutation Testing

on:
  workflow_dispatch:
    inputs:
      projects:
        description: 'Projects to test (comma-separated, e.g. Guard,Brain or ALL)'
        required: true
        default: 'ALL'
      concurrency:
        description: 'Parallel test sessions per runner'
        required: false
        default: '8'
        type: choice
        options:
          - '2'
          - '4'
          - '8'
      break_threshold:
        description: 'Break threshold (0=never break, 60=fail if score<60%)'
        required: false
        default: '0'
        type: choice
        options:
          - '0'
          - '40'
          - '60'
          - '80'
  schedule:
    - cron: '40 8 * * *'

concurrency:
  group: mutation-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  DOTNET_NOLOGO: true
  NUGET_XMLDOC_MODE: skip
  NUGET_PACKAGES: ${{ github.workspace }}/.nuget/packages

jobs:
  prepare:
    name: Prepare
    runs-on: ubuntu-latest
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    outputs:
      matrix: ${{ steps.set.outputs.matrix }}
    steps:
      - name: Build matrix
        id: set
        run: |
          ALL_PROJECTS='["Guard-Config","Guard-Security-Services","Guard-Security-PowerShell","Guard-Security-Other","Guard-Hooks","Vault-Memdir","Vault-Other","Brain-CtxAdmin","Brain-CtxChat","Brain-CtxOther","Brain-CtxNonServicesA","Brain-CtxNonServicesB","Brain-PromptsSections","Brain-PromptsOther","Brain-OtherA","Brain-OtherB","Hands-SysTools","Hands-CoreHandlers","Hands-DevTools","Hands-SkillServices","Hands-SkillBuiltIn","Hands-SkillOther","Hands-Api","Hands-Shell","Scheduling","McpToolDispatch","Llm","Agents","Reasoning","CodeIndex","Browser","Mcp","Eyes","Dream","Bridge-SessionA","Bridge-SessionB","Bridge-Transport","Bridge-CoreRuntime","Bridge-CoreOther","Bridge-Messaging","Bridge-ClientServer","Composition","Clock","Infra-IO-FileOps","Infra-IO-FsAndConfig","Infra-IO-ProcessAndOther","Infra-Utils-TextA1a","Infra-Utils-TextA1b","Infra-Utils-TextA2a","Infra-Utils-TextA2b","Infra-Utils-TextB1","Infra-Utils-TextB2","Infra-Utils-Resilience","Infra-Utils-OtherA1a","Infra-Utils-OtherA1b","Infra-Utils-Validation1","Infra-Utils-Validation2","Infra-Utils-Async","Infra-Utils-Services","Infra-Utils-OtherB","Infra-Services","Host-Commands","Host-Other"]'
          INPUT="${{ github.event.inputs.projects || 'ALL' }}"
          if [ "$INPUT" = "ALL" ]; then
            echo "matrix={\"include\":$(echo $ALL_PROJECTS | jq -c '[.[] | {project: .}]')}" >> $GITHUB_OUTPUT
          else
            EXPANDED=""
            IFS=',' read -ra PARTS <<< "$INPUT"
            for part in "${PARTS[@]}"; do
              trimmed=$(echo "$part" | xargs)
              if [ "$trimmed" = "Guard" ]; then
                EXPANDED="$EXPANDED,{\"project\":\"Guard-Config\"},{\"project\":\"Guard-Security-Services\"},{\"project\":\"Guard-Security-PowerShell\"},{\"project\":\"Guard-Security-Other\"},{\"project\":\"Guard-Hooks\"}"
              elif [ "$trimmed" = "Vault" ]; then
                EXPANDED="$EXPANDED,{\"project\":\"Vault-Memdir\"},{\"project\":\"Vault-Other\"}"
              elif [ "$trimmed" = "Brain" ]; then
                EXPANDED="$EXPANDED,{\"project\":\"Brain-CtxAdmin\"},{\"project\":\"Brain-CtxChat\"},{\"project\":\"Brain-CtxOther\"},{\"project\":\"Brain-CtxNonServicesA\"},{\"project\":\"Brain-CtxNonServicesB\"},{\"project\":\"Brain-PromptsSections\"},{\"project\":\"Brain-PromptsOther\"},{\"project\":\"Brain-OtherA\"},{\"project\":\"Brain-OtherB\"}"
              elif [ "$trimmed" = "Hands" ]; then
                EXPANDED="$EXPANDED,{\"project\":\"Hands-SysTools\"},{\"project\":\"Hands-CoreHandlers\"},{\"project\":\"Hands-DevTools\"},{\"project\":\"Hands-SkillServices\"},{\"project\":\"Hands-SkillBuiltIn\"},{\"project\":\"Hands-SkillOther\"},{\"project\":\"Hands-Api\"},{\"project\":\"Hands-Shell\"}"
              elif [ "$trimmed" = "Host" ]; then
                EXPANDED="$EXPANDED,{\"project\":\"Host-Commands\"},{\"project\":\"Host-Other\"}"
              elif [ "$trimmed" = "Bridge" ]; then
                EXPANDED="$EXPANDED,{\"project\":\"Bridge-SessionA\"},{\"project\":\"Bridge-SessionB\"},{\"project\":\"Bridge-Transport\"},{\"project\":\"Bridge-CoreRuntime\"},{\"project\":\"Bridge-CoreOther\"},{\"project\":\"Bridge-Messaging\"},{\"project\":\"Bridge-ClientServer\"}"
              elif [ "$trimmed" = "Infra" ]; then
                EXPANDED="$EXPANDED,{\"project\":\"Infra-IO-FileOps\"},{\"project\":\"Infra-IO-FsAndConfig\"},{\"project\":\"Infra-IO-ProcessAndOther\"},{\"project\":\"Infra-Utils-TextA1a\"},{\"project\":\"Infra-Utils-TextA1b\"},{\"project\":\"Infra-Utils-TextA2a\"},{\"project\":\"Infra-Utils-TextA2b\"},{\"project\":\"Infra-Utils-TextB1\"},{\"project\":\"Infra-Utils-TextB2\"},{\"project\":\"Infra-Utils-Resilience\"},{\"project\":\"Infra-Utils-OtherA1a\"},{\"project\":\"Infra-Utils-OtherA1b\"},{\"project\":\"Infra-Utils-Validation1\"},{\"project\":\"Infra-Utils-Validation2\"},{\"project\":\"Infra-Utils-Async\"},{\"project\":\"Infra-Utils-Services\"},{\"project\":\"Infra-Utils-OtherB\"},{\"project\":\"Infra-Services\"}"
              else
                EXPANDED="$EXPANDED,{\"project\":\"$trimmed\"}"
              fi
            done
            EXPANDED="${EXPANDED#,}"
            echo "matrix={\"include\":[$EXPANDED]}" >> $GITHUB_OUTPUT
          fi

  mutation-test:
    name: Stryker - ${{ matrix.project }}
    needs: prepare
    runs-on: windows-latest
    timeout-minutes: 60
    strategy:
      matrix: ${{ fromJson(needs.prepare.outputs.matrix) }}
      fail-fast: false
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: 'global.json'

      - name: Install Stryker.NET
        run: dotnet tool install dotnet-stryker --global

      - name: Cache NuGet Packages
        uses: actions/cache@v5
        with:
          path: ${{ github.workspace }}/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', 'Directory.Build.props') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      - name: Cache Build Artifacts
        uses: actions/cache@v5
        with:
          path: |
            ${{ github.workspace }}/artifacts/bin
            ${{ github.workspace }}/artifacts/obj
          key: build-v3-${{ runner.os }}-${{ hashFiles('**/*.cs', '**/*.csproj', 'Directory.Build.props', '**/*.slnx', '.github/workflows/mutation-testing.yml') }}
          restore-keys: |
            build-v3-${{ runner.os }}-

      - name: Build - ① Generators
        run: dotnet build build/sln/Generators.slnx -c Debug --nologo -m /p:SkipLocalPack=true /p:ProduceReferenceAssembly=true

      - name: Build - ② Foundation
        run: dotnet build build/sln/Foundation.slnx -c Debug --nologo -m /p:SkipLocalPack=true /p:ProduceReferenceAssembly=true

      - name: Build - ③ Infrastructure
        run: dotnet build build/sln/Infrastructure.slnx -c Debug --nologo -m /p:SkipLocalPack=true /p:ProduceReferenceAssembly=true

      - name: Build - ④ Core
        run: dotnet build build/sln/Core.slnx -c Debug --nologo -m /p:SkipLocalPack=true /p:ProduceReferenceAssembly=true

      - name: Build - ⑤ Services
        run: dotnet build build/sln/Services.slnx -c Debug --nologo -m /p:SkipLocalPack=true /p:ProduceReferenceAssembly=true

      - name: Build - ⑥ Composition
        run: dotnet build build/sln/Composition.slnx -c Debug --nologo -m /p:SkipLocalPack=true /p:ProduceReferenceAssembly=true

      - name: Build - ⑦ App
        run: dotnet build build/sln/App.slnx -c Debug --nologo -m /p:SkipLocalPack=true /p:ProduceReferenceAssembly=true

      - name: Run Stryker
        shell: pwsh
        env:
          STRYKER_PROJECT: ${{ matrix.project }}
          STRYKER_CONCURRENCY: ${{ github.event.inputs.concurrency || '8' }}
          STRYKER_BREAK: ${{ github.event.inputs.break_threshold || '0' }}
          VSTEST_CONNECTION_TIMEOUT: 300
          DOTNET_EnableDiagnostics: 0
        run: |
          $projectMap = @{
            'Guard-Config'         = @{ Dir = 'lib\guard.config.tests';   Src = 'Guard.csproj';           Mutate = @('Configuration/**','DependencyInjection/**','Policy/**','OAuth/**') }
            'Guard-Security-Services'   = @{ Dir = 'lib\guard.security.tests'; Src = 'Guard.csproj'; Mutate = @('Security/Services/**') }
            'Guard-Security-PowerShell' = @{ Dir = 'lib\guard.security.tests'; Src = 'Guard.csproj'; Mutate = @('Security/PowerShell/**') }
            'Guard-Security-Other'      = @{ Dir = 'lib\guard.security.tests'; Src = 'Guard.csproj'; Mutate = @('Security/DangerClassification/**','Security/Sandbox/**','Security/Shell/**','Security/Scanners/**','Security/Interceptors/**','Security/Constants/**') }
            'Guard-Hooks'          = @{ Dir = 'lib\guard.hooks.tests';    Src = 'Guard.csproj';           Mutate = @('Hooks/**','Permission/**') }
            'Vault-Memdir'         = @{ Dir = 'lib\vault.memdir.tests';   Src = 'Vault.csproj';           Mutate = @('Memdir/**') }
            'Vault-Other'          = @{ Dir = 'lib\vault.other.tests';    Src = 'Vault.csproj';           Mutate = @('State/**','Todo/**','UserInteraction/**','StepEvidence/**','Notification/**','DependencyInjection/**') }
            'Brain-CtxAdmin'       = @{ Dir = 'kit\brain.context.tests'; Src = 'Brain.csproj';         Mutate = @('Context/Services/Admin/**') }
            'Brain-CtxChat'        = @{ Dir = 'kit\brain.context.tests'; Src = 'Brain.csproj';         Mutate = @('Context/Services/Chat/**','Context/Services/ChatInit/**') }
            'Brain-CtxOther'       = @{ Dir = 'kit\brain.context.tests'; Src = 'Brain.csproj';         Mutate = @('Context/Services/Preprocess/**','Context/Services/Context/**','Context/Services/Processor/**','Context/Services/Prompt/**','Context/Services/Idle/**','Context/Services/Loop/**') }
            'Brain-CtxNonServicesA' = @{ Dir = 'kit\brain.context.tests'; Src = 'Brain.csproj';         Mutate = @('Context/Compact/**','Context/Compression/**') }
            'Brain-CtxNonServicesB' = @{ Dir = 'kit\brain.context.tests'; Src = 'Brain.csproj';         Mutate = @('Context/Collapse/**','Context/Core/**','Context/Resolution/**') }
            'Brain-PromptsSections'= @{ Dir = 'kit\brain.prompts.tests'; Src = 'Brain.csproj';         Mutate = @('Prompts/Sections/**') }
            'Brain-PromptsOther'   = @{ Dir = 'kit\brain.prompts.tests'; Src = 'Brain.csproj';         Mutate = @('Prompts/Services/**','Prompts/Testing/**','Prompts/Templates/**','Prompts/Utils/**','Prompts/Core/**') }
            'Brain-OtherA'         = @{ Dir = 'kit\brain.other.tests';  Src = 'Brain.csproj';           Mutate = @('Context/**','Prompts/**') }
            'Brain-OtherB'         = @{ Dir = 'kit\brain.other.tests';  Src = 'Brain.csproj';           Mutate = @('Query/**','Planning/**','CostTracking/**','ContextFold/**','Summary/**','Cache/**','DependencyInjection/**') }
            'Hands-SysTools'       = @{ Dir = 'kit\hands.tool_handlers.tests'; Src = 'Hands.csproj';   Mutate = @('ToolHandlers/Handlers/SystemTools/**') }
            'Hands-CoreHandlers'   = @{ Dir = 'kit\hands.tool_handlers.tests'; Src = 'Hands.csproj';   Mutate = @('ToolHandlers/Handlers/Core/**') }
            'Hands-DevTools'       = @{ Dir = 'kit\hands.tool_handlers.tests'; Src = 'Hands.csproj';   Mutate = @('ToolHandlers/Handlers/DevTools/**') }
            'Hands-SkillServices'  = @{ Dir = 'kit\hands.skills.tests'; Src = 'Hands.csproj';         Mutate = @('Skills/Services/**','Skills/Mcp/**','Skills/Plugin/**') }
            'Hands-SkillBuiltIn'   = @{ Dir = 'kit\hands.skills.tests'; Src = 'Hands.csproj';         Mutate = @('Skills/BuiltIn/**','Skills/Skills/**') }
            'Hands-SkillOther'     = @{ Dir = 'kit\hands.skills.tests'; Src = 'Hands.csproj';         Mutate = @('Skills/Discovery/**','Skills/Search/**','Skills/Utils/**') }
            'Hands-Api'            = @{ Dir = 'kit\hands.api.tests';    Src = 'Hands.csproj';           Mutate = @('Api/**','Web/**','Network/**','Integration/**') }
            'Hands-Shell'          = @{ Dir = 'kit\hands.shell.tests';  Src = 'Hands.csproj';           Mutate = @('Shell/**','FileOps/**','System/**','Voice/**','Notebook/**','Serialization/**','Build/**','Cache/**','DependencyInjection/**') }
            'Scheduling'           = @{ Dir = 'lib\scheduling.tests';     Src = 'Scheduling.csproj';      Mutate = @() }
            'McpToolDispatch'      = @{ Dir = 'kit\mcp_tool_dispatch.tests'; Src = 'McpToolDispatch.csproj'; Mutate = @() }
            'Llm'                  = @{ Dir = 'llm\llm.tests';                         Src = 'Llm.csproj';             Mutate = @() }
            'Agents'               = @{ Dir = 'llm\agents.tests';                      Src = 'Agents.csproj';          Mutate = @() }
            'Reasoning'            = @{ Dir = 'llm\reasoning.tests';                   Src = 'Reasoning.csproj';       Mutate = @() }
            'CodeIndex'            = @{ Dir = 'server\code_index.tests';        Src = 'CodeIndex.csproj';       Mutate = @() }
            'Browser'              = @{ Dir = 'server\browser.tests';          Src = 'Browser.csproj';         Mutate = @() }
            'Mcp'                  = @{ Dir = 'kit\mcp.tests';                 Src = 'Mcp.csproj';             Mutate = @() }
            'Eyes'                 = @{ Dir = 'server\eyes.tests';                Src = 'Eyes.csproj';            Mutate = @() }
            'Dream'                = @{ Dir = 'server\dream.tests';               Src = 'Dream.csproj';            Mutate = @() }
            'Bridge-SessionA'     = @{ Dir = 'server\bridge.tests'; Src = 'Bridge.csproj'; Mutate = @('Session/Main/**'); Concurrency = 2 }
            'Bridge-SessionB'     = @{ Dir = 'server\bridge.tests'; Src = 'Bridge.csproj'; Mutate = @('Session/**','!Session/Main/**'); Concurrency = 2 }
            'Bridge-Transport'    = @{ Dir = 'server\bridge.tests'; Src = 'Bridge.csproj'; Mutate = @('Transport/**'); Concurrency = 2 }
            'Bridge-CoreRuntime'  = @{ Dir = 'server\bridge.tests'; Src = 'Bridge.csproj'; Mutate = @('Core/Runtime/**'); Concurrency = 2 }
            'Bridge-CoreOther'    = @{ Dir = 'server\bridge.tests'; Src = 'Bridge.csproj'; Mutate = @('Core/**','!Core/Runtime/**'); Concurrency = 2 }
            'Bridge-Messaging'    = @{ Dir = 'server\bridge.tests'; Src = 'Bridge.csproj'; Mutate = @('Messaging/**'); Concurrency = 2 }
            'Bridge-ClientServer' = @{ Dir = 'server\bridge.tests'; Src = 'Bridge.csproj'; Mutate = @('Client/**','Server/**','Config/**','Security/**'); Concurrency = 2 }
            'Composition'          = @{ Dir = 'kit\composition.tests';      Src = 'Composition.csproj';     Mutate = @() }
            'Clock'                = @{ Dir = 'lib\clock.tests';            Src = 'Clock.csproj';           Mutate = @() }
            'Infra-IO-FileOps'       = @{ Dir = 'test\unit\infra.tests\io';                 Src = 'Infrastructure.csproj';      Test = 'Infra.IO.Tests.csproj';      Mutate = @('IO/Services/FileOps/**') }
            'Infra-IO-FsAndConfig'   = @{ Dir = 'test\unit\infra.tests\io';                 Src = 'Infrastructure.csproj';      Test = 'Infra.IO.Tests.csproj';      Mutate = @('IO/FileSystem/**','IO/Configuration/**','IO/Services/Throttle/**') }
            'Infra-IO-ProcessAndOther' = @{ Dir = 'test\unit\infra.tests\io';               Src = 'Infrastructure.csproj';      Test = 'Infra.IO.Tests.csproj';      Mutate = @('IO/Process/**','IO/Console/**','IO/Services/Terminal/**','IO/Services/Diff/**','Http/**','Process/**','Ssh/**','Windows/**','Shell/**') }
            'Infra-Utils-TextA1a'  = @{ Dir = 'test\unit\infra.tests\utils';              Src = 'Infrastructure.csproj';      Test = 'Infra.Utils.Tests.csproj';   Mutate = @('Utils/Text/FrontmatterParser.cs') }
            'Infra-Utils-TextA1b'  = @{ Dir = 'test\unit\infra.tests\utils';              Src = 'Infrastructure.csproj';      Test = 'Infra.Utils.Tests.csproj';   Mutate = @('Utils/Text/MarkdownWalker.cs') }
            'Infra-Utils-TextA2a'  = @{ Dir = 'test\unit\infra.tests\utils';              Src = 'Infrastructure.csproj';      Test = 'Infra.Utils.Tests.csproj';   Mutate = @('Utils/Text/AhoCorasick.cs') }
            'Infra-Utils-TextA2b'  = @{ Dir = 'test\unit\infra.tests\utils';              Src = 'Infrastructure.csproj';      Test = 'Infra.Utils.Tests.csproj';   Mutate = @('Utils/Text/DualBufferAhoCorasick.cs') }
            'Infra-Utils-TextB1'   = @{ Dir = 'test\unit\infra.tests\utils';              Src = 'Infrastructure.csproj';      Test = 'Infra.Utils.Tests.csproj';   Mutate = @('Utils/Text/ErrorMessages.cs','Utils/Text/DurationFormatter.cs','Utils/Text/FileSizeFormatter.cs') }
            'Infra-Utils-TextB2'   = @{ Dir = 'test\unit\infra.tests\utils';              Src = 'Infrastructure.csproj';      Test = 'Infra.Utils.Tests.csproj';   Mutate = @('Utils/Text/GlobMatcher.cs','Utils/Text/JsonArgumentParser.cs','Utils/Text/StringBuilderPool.cs') }
            'Infra-Utils-Resilience' = @{ Dir = 'test\unit\infra.tests\utils';              Src = 'Infrastructure.csproj';      Test = 'Infra.Utils.Tests.csproj';   Mutate = @('Utils/Resilience/**') }
            'Infra-Utils-OtherA1a'  = @{ Dir = 'test\unit\infra.tests\utils'; Src = 'Infrastructure.csproj'; Test = 'Infra.Utils.Tests.csproj'; Mutate = @('Housekeeping/**') }
            'Infra-Utils-OtherA1b'  = @{ Dir = 'test\unit\infra.tests\utils'; Src = 'Infrastructure.csproj'; Test = 'Infra.Utils.Tests.csproj'; Mutate = @('Cache/**','AsyncFileLock/**') }
            'Infra-Utils-Validation1' = @{ Dir = 'test\unit\infra.tests\utils'; Src = 'Infrastructure.csproj'; Test = 'Infra.Utils.Tests.csproj'; Mutate = @('Utils/Validation/ValidationHelper.cs') }
            'Infra-Utils-Validation2' = @{ Dir = 'test\unit\infra.tests\utils'; Src = 'Infrastructure.csproj'; Test = 'Infra.Utils.Tests.csproj'; Mutate = @('Utils/Validation/ArgumentValidator.cs') }
            'Infra-Utils-Async'      = @{ Dir = 'test\unit\infra.tests\utils'; Src = 'Infrastructure.csproj'; Test = 'Infra.Utils.Tests.csproj'; Mutate = @('Utils/Async/**') }
            'Infra-Utils-Services'   = @{ Dir = 'test\unit\infra.tests\utils'; Src = 'Infrastructure.csproj'; Test = 'Infra.Utils.Tests.csproj'; Mutate = @('Utils/Services/**') }
            'Infra-Utils-OtherB'    = @{ Dir = 'test\unit\infra.tests\utils'; Src = 'Infrastructure.csproj'; Test = 'Infra.Utils.Tests.csproj'; Mutate = @('Utils/State/**','Utils/Throttle/**','Utils/Collections/**','Utils/Pooling/**','Utils/IO/**','Utils/Generation/**','Utils/System/**','Configuration/**','Time/**','EntityReaper/**','ReaperScheduler/**') }
            'Infra-Services'         = @{ Dir = 'test\unit\infra.tests\services';           Src = 'Infrastructure.csproj';      Test = 'Infra.Services.Tests.csproj'; Mutate = @('Localization/**','Pipeline/**','Plugins/**','Telemetry/**') }
            'Host-Commands'        = @{ Dir = 'test\unit\host.tests';                   Src = 'JoinCode.csproj';        Mutate = @('Commands/**') }
            'Host-Other'           = @{ Dir = 'test\unit\host.tests';                   Src = 'JoinCode.csproj';        Mutate = @('App/**','Cli/**','Entry/**','Pipe/**','Services/**') }
          }

          $name = $env:STRYKER_PROJECT
          $info = $projectMap[$name]
          if (-not $info) { Write-Error "Unknown project: $name"; exit 1 }

          $testDir = Join-Path $env:GITHUB_WORKSPACE $info.Dir
          $concurrency = if ($info.ContainsKey('Concurrency')) { [int]$info.Concurrency } else { [int]$env:STRYKER_CONCURRENCY }
          $breakThreshold = [int]$env:STRYKER_BREAK

          $slnx = 'build/sln/Stryker.slnx'
          $slnxPath = Join-Path $env:GITHUB_WORKSPACE $slnx

          $strykerArgs = @("-p", $info.Src, "-s", $slnxPath, "-c", $concurrency, "-b", $breakThreshold, "--configuration", "Debug", "--threshold-low", "60", "--threshold-high", "80", "-r", "progress", "-r", "html", "-r", "json", "-r", "markdown")

          if ($info.ContainsKey('Test') -and $info.Test) {
            $strykerArgs += @("--test-project", $info.Test)
          }

          $strykerArgs += @("--mutate", "!**/GlobalUsings.cs", "--mutate", "!**/AssemblyInfo.cs", "--mutate", "!**/*Options.cs", "--mutate", "!**/*Factory.cs", "--mutate", "!**/I*.cs", "--mutate", "!**/*Constants.cs", "--mutate", "!**/*Exception.cs")
          if ($info.Mutate.Count -gt 0) {
            foreach ($m in $info.Mutate) {
              $strykerArgs += @("--mutate", $m)
            }
          }

          Write-Host "Stryker: $name | Source: $($info.Src) | Dir: $testDir | Slnx: $slnx | Concurrency: $concurrency | Mutate: $($info.Mutate.Count) patterns"

          # Stryker 4.16 的 test-case-filter 只能通过配置文件设置（命令行 N/A）
          # 注意: 此文件会遮蔽上级目录 stryker-config.json,必须携带 additional-timeout 防止变异死锁时测试session无限hang
          $configPath = Join-Path $testDir "stryker-config.json"
          '{"stryker-config":{"test-case-filter":"Category!=Integration","additional-timeout":5000}}' | Out-File -FilePath $configPath -Encoding utf8 -NoNewline

          Push-Location $testDir
          try {
            & dotnet-stryker @strykerArgs
          } finally {
            Pop-Location
            Remove-Item $configPath -Force -ErrorAction SilentlyContinue
          }

      - name: Upload Stryker Reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: stryker-report-${{ matrix.project }}
          path: |
            **/StrykerOutput/**/reports/mutation-report.html
            **/StrykerOutput/**/reports/mutation-report.json
            **/StrykerOutput/**/reports/mutation-report.md
          retention-days: 30

name: Publish NuGet Packages

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      publish_target:
        description: 'Publish target'
        required: true
        default: 'github-packages'
        type: choice
        options:
          - github-packages
          - nuget-org

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore build/sln/JoinCode.slnx

      - name: Build
        run: dotnet build build/sln/JoinCode.slnx --no-restore --configuration Release

      - name: Pack
        run: |
          dotnet pack build/sln/JoinCode.slnx \
            --no-build \
            --configuration Release \
            --output artifacts/nuget \
            -p:UsePackedComponents=false

      - name: Publish to GitHub Packages
        if: github.event.inputs.publish_target != 'nuget-org'
        run: |
          dotnet nuget push artifacts/nuget/*.nupkg \
            --api-key ${{ secrets.GITHUB_TOKEN }} \
            --source https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json \
            --skip-duplicate

      - name: Publish to nuget.org
        if: github.event.inputs.publish_target == 'nuget-org'
        run: |
          dotnet nuget push artifacts/nuget/*.nupkg \
            --api-key ${{ secrets.NUGET_API_KEY }} \
            --source https://api.nuget.org/v3/index.json \
            --skip-duplicate

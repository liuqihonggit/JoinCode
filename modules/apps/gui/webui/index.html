<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>JoinCode WebUI</title>
<link rel="stylesheet" href="styles/tokens.css">
<link rel="stylesheet" href="styles/app.css">
</head>
<body>
<div class="frame">

  <aside class="sidebar">
    <div class="logo-row">
      <div class="brand">
        <svg class="mark" viewBox="0 0 24 18" aria-hidden="true">
          <path fill="currentColor" d="M1 12c0-6 5-11 11-11s11 5 11 11c-2.2-2.4-5.4-3.6-8.8-3l-1.6-3h-2.2l1.4 3.4C7.5 9.7 3.6 10.4 1 12z"/>
        </svg>
        <span class="word">deepseek</span>
        <span class="harness">HARNESS</span>
      </div>
      <button class="icon-btn" aria-label="收起侧栏">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3">
          <rect x="1.5" y="2.5" width="13" height="11" rx="2.5"/>
          <line x1="6.5" y1="2.5" x2="6.5" y2="13.5"/>
        </svg>
      </button>
    </div>

    <button class="new-session">
      <span class="ns-center">
        <svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.4">
          <circle cx="7" cy="7" r="5.8"/>
          <path d="M7 4.8v4.4M4.8 7h4.4" stroke-width="1.6" opacity="0.5"/>
        </svg>
        <span>新会话</span>
      </span>
    </button>

    <nav class="panel-list">
      <button class="panel-row">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3">
          <path d="M6 2.5h4v3h3v4h-3v3.5H6v-3.5H3v-4h3z"/>
        </svg>
        <span>插件</span>
      </button>
    </nav>

    <div class="region">
      <div class="section-header">
        <span class="label">工作区</span>
        <span class="spacer"></span>
        <button class="icon-btn" aria-label="搜索">
          <svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.3">
            <circle cx="6" cy="6" r="4"/>
            <line x1="9.2" y1="9.2" x2="12.2" y2="12.2"/>
          </svg>
        </button>
        <span class="actions">
          <button class="icon-btn" aria-label="排序">
            <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3">
              <path d="M5 3v10M5 13l-2.2-2.2M5 13l2.2-2.2"/>
              <path d="M11 13V3M11 3L8.8 5.2M11 3l2.2 2.2"/>
            </svg>
          </button>
          <button class="icon-btn" aria-label="面板">
            <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3">
              <rect x="1.5" y="2.5" width="13" height="11" rx="2.5"/>
              <line x1="10.5" y1="2.5" x2="10.5" y2="13.5"/>
            </svg>
          </button>
        </span>
      </div>
      <div class="list">
        <div class="project-row">
          <span class="icon">
            <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3">
              <path d="M1.5 4.5a1.5 1.5 0 0 1 1.5-1.5h3l1.5 1.8h5A1.5 1.5 0 0 1 14 6.3v.2H3.6a1.6 1.6 0 0 0-1.6 1.5z"/>
              <path d="M2 8l1.3 4a1.5 1.5 0 0 0 1.5 1.2h6.5a1.5 1.5 0 0 0 1.4-1l1.4-4.2z"/>
            </svg>
          </span>
          <span>默认工作区</span>
        </div>
        <div class="session-row selected">
          <span class="icon">
            <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3">
              <path d="M2 4.5A2.5 2.5 0 0 1 4.5 2h7A2.5 2.5 0 0 1 14 4.5v4A2.5 2.5 0 0 1 11.5 11H7l-3.4 2.7V11H4.5A2.5 2.5 0 0 1 2 8.5z"/>
            </svg>
          </span>
          <span>新会话</span>
        </div>
      </div>
    </div>

    <div class="foot">
      <button class="settings-btn">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3">
          <circle cx="8" cy="8" r="2.2"/>
          <path d="M8 1.5v2M8 12.5v2M1.5 8h2M12.5 8h2M3.4 3.4l1.4 1.4M11.2 11.2l1.4 1.4M12.6 3.4l-1.4 1.4M4.8 11.2l-1.4 1.4"/>
        </svg>
        <span>设置</span>
      </button>
    </div>
  </aside>

  <main class="center">
    <header class="center-header">
      <button class="corner" aria-label="右侧面板">
        <svg width="15" height="15" viewBox="0 0 15 15" fill="none" stroke="currentColor" stroke-width="1.3">
          <rect x="1.5" y="1.5" width="12" height="12" rx="2.5"/>
          <line x1="9.5" y1="1.5" x2="9.5" y2="13.5"/>
        </svg>
      </button>
    </header>
    <div class="center-body">
      <div class="message-list" aria-live="polite"></div>
      <div class="composer-seat">
        <div class="composer-stack">

          <div class="headline-row">
            <div class="content">
              <span class="fish">
                <svg width="34" height="25" viewBox="0 0 34 25" aria-hidden="true">
                  <circle cx="13" cy="12.5" r="11.2" fill="var(--dsw-alias-label-primary)"/>
                  <path fill="var(--dsw-alias-bg-base)" d="M24.2 12.5c0 3.6-1.7 6.7-4.3 8.7 2.6-1 4.9-2.9 6.3-5.4.7-1.2 1.2-2.6 1.4-4.1-.9.3-2 .6-3.4 .8z"/>
                  <path fill="var(--dsw-alias-label-primary)" d="M18.5 1.6l7.2-1.6-2.8 6.6c-.8-1.9-2.3-3.8-4.4-5z"/>
                  <path fill="var(--dsw-alias-label-primary)" d="M3.2 2.4l.6 1.7-1.7.6 1.7.6-.6 1.7 1.7-.6.6 1.7.6-1.7 1.7-.6-1.7-.6.6-1.7-1.7.6z" opacity="0.9"/>
                </svg>
              </span>
              <span class="title-group">
                <span class="title">探索未至之境</span>
                <span class="preview-badge">预览版</span>
              </span>
            </div>
          </div>

          <div class="workspace-row">
            <button class="chip">
              <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3">
                <path d="M2.5 6.5L8 2l5.5 4.5V13a1 1 0 0 1-1 1h-9a1 1 0 0 1-1-1z"/>
              </svg>
              <span>默认工作区</span>
              <svg class="chev" width="12" height="12" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.4">
                <path d="M3 4.5L6 7.5l3-3"/>
              </svg>
            </button>
            <button class="chip">
              <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3">
                <circle cx="8" cy="8" r="6"/>
                <circle cx="8" cy="8" r="2" fill="currentColor" stroke="none"/>
              </svg>
              <span>标准模式</span>
              <svg class="chev" width="12" height="12" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.4">
                <path d="M3 4.5L6 7.5l3-3"/>
              </svg>
            </button>
          </div>

          <div class="composer">
            <div class="composer-card">
              <div class="composer-input">
                <textarea class="composer-textarea" rows="1" aria-label="输入提示词"></textarea>
                <div class="composer-placeholder">描述你想要构建的内容, / 调用指令, @ 文件或对话</div>
              </div>
              <div class="composer-row">
                <div class="tools">
                  <button class="add-btn" aria-label="添加">
                    <svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.4">
                      <line x1="7" y1="2" x2="7" y2="12"/>
                      <line x1="2" y1="7" x2="12" y2="7"/>
                    </svg>
                  </button>
                  <button class="mode-chip">
                    <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3">
                      <path d="M5.5 2H4a2 2 0 0 0-2 2v1.5M10.5 2H12a2 2 0 0 1 2 2v1.5M5.5 14H4a2 2 0 0 1-2-2v-1.5M10.5 14H12a2 2 0 0 0 2-2v-1.5"/>
                      <rect x="5.5" y="5.5" width="5" height="5" rx="1"/>
                    </svg>
                    <span>工作区内修改</span>
                    <svg class="chev" width="12" height="12" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.4">
                      <path d="M3 4.5L6 7.5l3-3"/>
                    </svg>
                  </button>
                </div>
                <div class="trailing">
                  <button class="model-chip">
                    <span>DeepSeek-V41-Flash</span>
                    <span class="dimmer">High</span>
                    <svg class="chev" width="12" height="12" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.4">
                      <path d="M3 4.5L6 7.5l3-3"/>
                    </svg>
                  </button>
                  <button class="send-btn" aria-label="发送" disabled>
                    <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6">
                      <path d="M8 12.5V3.5M8 3.5L4.5 7M8 3.5L11.5 7"/>
                    </svg>
                  </button>
                </div>
              </div>
            </div>
          </div>

        </div>
      </div>
    </div>
  </main>

</div>
<script src="js/bridge.js"></script>
</body>
</html>

      - id: web-metrics-mw
        priority: 400
      - id: web-validation-mw
        priority: 500
      - id: web-ssrf-guard-mw
        priority: 600
      - id: web-cache-check-mw
        priority: 700
      - id: web-domain-check-mw
        priority: 800
      - id: web-fetch-mw
        priority: 900
      - id: web-content-processing-mw
        priority: 1000
      - id: web-cache-write-mw

  agent-tool-pipeline:
    nodes:
      - id: agent-validation-mw
        priority: 100
      - id: agent-fork-mw
        priority: 200
      - id: agent-background-spawn-mw
        priority: 300
      - id: agent-stream-execution-mw
        priority: 400
      - id: agent-handoff-mw
        priority: 500

  # TASK100 S2：命令守卫链 — 顺序唯一来源就是这里（priority 降序 = 先评估）。
  # orders.yaml 的 command_guards 退化为生成期校验表，运行期不再读它。
  command-guard-chain:
    contract: guard
    nodes:
      - id: git-commit-guard
        priority: 800
      - id: drive-protection-guard
        priority: 700
      - id: cmd-indirect-call-guard
        priority: 600
      - id: robocopy-mirror-guard
        priority: 500
      - id: heredoc-guard
        priority: 400
      - id: gh-pr-body-guard
        priority: 300
      - id: gh-timeout-guard
        priority: 200
      - id: vpn-route-guard
        priority: 100

  # TASK100 S2b：工具修正器链 — 顺序唯一来源同守卫链（priority 降序 = 先尝试）。
  tool-fix-chain:
    contract: guard
    nodes:
      - id: gh-pr-body-fix-hook
        priority: 300
      - id: json-fix-hook
        priority: 200
      - id: gh-timeout-fix-hook
        priority: 100

  # TASK100 S2c：Bash 防御链 — MTP 扰动纵深防御（priority 降序 = 先执行，首个非 null 即短路）。
  # 此前这 6 步硬编码在 ShellCommandInterceptionMiddleware 的 .Then(...) 里，改顺序要重编译。
  bash-defense-chain:
    contract: guard
    nodes:
      - id: dangerous-command
        priority: 600
      - id: strict-parse
        priority: 500
      - id: retained-device
        priority: 400
      - id: redirect-whitelist
        priority: 300
      - id: git-push-ci-guard
        priority: 200
      - id: argv-hash
        priority: 100

  # TASK100 S3：内置 Agent 角色（contract: role — 同 role+variant 互斥）。
  # 未声明的角色不登记：查询按既有语义返回 null（角色缺失只是少一个可选能力，不像协议缺失会发错格式）。
  agent-roles:
    contract: role
    nodes:
      - id: coordinator
        priority: 900
      - id: executor-code
        priority: 800
      - id: executor-search
        priority: 700
      - id: executor-explore
        priority: 600
      - id: executor-plan
        priority: 500
      - id: executor-doctor
        priority: 400
      - id: executor-verification
        priority: 300
      - id: executor-join-code-guide
        priority: 200
      - id: executor-context-compression
        priority: 100

  # TASK100 S3：LLM 协议实现（contract: provider — 同协议内互斥）。
  # 对 provider 契约，priority 不表达顺序，只表达「启用集合」：不在集合内的协议直接拒绝，
  # 而不是静默退回默认实现（那会把 A 协议的配置按 B 协议格式发出去）。
  llm-providers:
    contract: provider
    nodes:
      - id: openai-compatible
        priority: 700
      - id: anthropic
        priority: 600
      - id: azure
        priority: 500
      - id: agnes
        priority: 400
      - id: openai-responses
        priority: 300
      - id: jev
        priority: 200
      - id: hub
        priority: 100

  # TASK100 S2c：沙箱提供器（contract: provider — 同协议内互斥，按 priority 降序 = 降级时先试）。
  # 这里只是「偏好顺序」；本平台不可用的实现会被 SandboxManager 按 IsAvailable 过滤掉，
  # 所以一份清单可以跨平台通用（Windows 上 bubblewrap 不可用 → 实际顺序 process > soft）。
  # docker 排最后是保持既有行为：历史上它从不进入自动降级链，只供显式指定。
  sandbox-providers:
    contract: provider
    nodes:
      - id: bubblewrap-sandbox-provider
        priority: 400
      - id: process-sandbox-provider
        priority: 300
      - id: soft-sandbox-provider
        priority: 200
      - id: docker-sandbox-provider
        priority: 100

  # TASK100 S4：引擎可选能力（contract: capability — 存在即提供，彼此不互斥）。
  # 删掉一条 = 对应服务在 EngineServiceContext 里为 null + 对应插件不加载。
  # 未声明整段消费点 = 全开（向后兼容）；声明了 = 白名单。
  # 只登记真有消费点的能力 —— vision 等没有可选服务被引擎消费的能力不登记（避免假节点）。
  capabilities:
    contract: capability
    nodes:
      - id: goal
        priority: 700
      - id: todo
        priority: 600
      - id: task
        priority: 500
      - id: cron
        priority: 400
      - id: memdir
        priority: 300
      - id: dream
        priority: 200
      - id: code-index
        priority: 100

  # TASK100 S4：CLI 入口子命令（contract: command-group — 分类聚合，各命令互不干扰）。
  # 此前 20 个 CliSubCommand 散在三处：枚举 / ApplicationBuilder 的 2 个 if / 路由器的 16 个 case。
  # 节点化后这张表就是 CLI 的命令表面：删掉一条，命令即从 CLI 消失（报「未在当前 profile 启用」）。
  # 未声明整段消费点 = 全开（向后兼容）；声明了 = 白名单。
  # ID 规则：CliSubCommand 枚举名称 kebab 化（不是 [EnumValue]，后者是 mcp_call 这种命令行字面量）。
  cli-commands:
    contract: command-group
    nodes:
      - id: schema
        priority: 100
      - id: config-print
        priority: 200
      - id: remote-control
        priority: 300
      - id: mcp-call
        priority: 400
      - id: mcp-list
        priority: 500
      - id: mcp-schema
        priority: 600
      - id: mcp-search
        priority: 700
      - id: mcp-serve
        priority: 800
      - id: slash-call
        priority: 900
      - id: slash-list
        priority: 1000
      - id: slash-schema
        priority: 1100
      - id: rg
        priority: 1200
      - id: gh
        priority: 1300
      - id: bridge-serve
        priority: 1400
      - id: tool
        priority: 1500
      - id: prompt
        priority: 1600
      - id: experience
        priority: 1700
      - id: probe
        priority: 1800

  # TASK100 S6：独立工具 exe 组（contract: capability — 存在即提供，彼此不互斥）。
  # 13 个组 = resources/tools/cli_groups.yaml 的组，含 388 个不经宿主的隔离工具。
  # 删掉一条的后果是三处同时生效：首轮提示词不再列出该组、jcc tool tree/find 看不到、
  # jcc tool call 报「未在当前 profile 启用」（退出码 2）。而不是只在某一层悄悄少几个工具。
  # 未声明整段消费点 = 全开（向后兼容）；声明了 = 白名单。ID 必须与 cli_groups.yaml 的组 ID 逐一相同，
  # 由 Verify-ToolGroupNodes.py 双向核对。
  tool-groups:
    contract: capability
    nodes:
      - id: agent
        priority: 100
      - id: code
        priority: 200
      - id: file
        priority: 300
      - id: git
        priority: 400
      - id: github
        priority: 500
      - id: mcp
        priority: 600
      - id: media
        priority: 700
      - id: search
        priority: 800
      - id: shell
        priority: 900
      - id: slash
        priority: 1000
      - id: system
        priority: 1100
      - id: tools
        priority: 1200
      - id: web
        priority: 1300

  # 历史：S1 曾删除原 tool-dispatch 4 条声明（shell/file/web/code_execution）——
  # 无工厂、无生产消费方。工具面的启停现在由上面两段承担：
  # capabilities 管宿主注册的 368 个工具（按分类），tool-groups 管 13 个 exe 组的 388 个隔离工具。
  command-dispatch:
    nodes:
      - id: 会话-command
        priority: 100
      - id: 模型-command
        priority: 200
      - id: 代码-command
        priority: 300
      - id: 工具-command
        priority: 400
      - id: 配置-command
        priority: 500
      - id: 信息-command
        priority: 600
      - id: 系统-command
        priority: 700
      - id: 认证-command
        priority: 800
      - id: 智能体-command
        priority: 900
      - id: 任务-command
        priority: 1000
      - id: 连接-command
        priority: 1100
      - id: 平台-command
        priority: 1200
      - id: 社交-command
        priority: 1300
      - id: 法律-command
        priority: 1400
      - id: 其他-command
        priority: 1500

  prompt-assembly:
    nodes:
      - id: always-prompt
        priority: 100
      - id: agent-mode-prompt
        priority: 200
      - id: coordinator-mode-prompt
        priority: 300

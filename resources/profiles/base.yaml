  dream-pipeline:
    nodes:
      - id: crash-snapshot-mw
        priority: 50
        config:
          pipeline-name: Dream
      - id: dream-gate-check-mw
        priority: 100
      - id: dream-session-scan-mw
        priority: 200
      - id: dream-task-register-mw
        priority: 300
      - id: dream-prompt-build-mw
        priority: 400
      - id: dream-llm-consolidate-mw
        priority: 500
      - id: dream-record-turn-mw
        priority: 600

  tool-execution-pipeline:
    nodes:
      - id: crash-snapshot-mw
        priority: 0
        config:
          pipeline-name: ToolExecution
      - id: argument-repair-mw
        priority: 100
      - id: required-params-mw
        priority: 200
      - id: schema-validation-mw
        priority: 300
      - id: agent-restriction-mw
        priority: 400
      - id: permission-check-mw
        priority: 500
      - id: pre-tool-use-hook-mw
        priority: 600
      - id: remote-policy-mw
        priority: 700
      - id: feature-flag-mw
        priority: 800
      - id: on-error-tool-injection-mw
        priority: 850
      - id: tool-health-scoring-mw
        priority: 860
      - id: tool-fix-hook-mw
        priority: 870
      - id: tool-aesthetic-mw
        priority: 880
      - id: post-tool-use-hook-mw
        priority: 890
      - id: tool-execution-mw

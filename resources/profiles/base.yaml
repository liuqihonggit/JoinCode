  shell-pipeline:
    nodes:
      - id: crash-snapshot-mw
        priority: 50
        config:
          pipeline-name: Shell
      - id: shell-timeout-keyword-mw
        priority: 100
      - id: absolute-timeout-mw
        priority: 200
      - id: shell-validate-mw
        priority: 300
      - id: shell-intercept-mw
        priority: 400
      - id: shell-path-gate-mw
        priority: 500
      - id: shell-classify-mw
        priority: 600
      - id: shell-sed-intercept-mw
        priority: 700
      - id: shell-background-mw
        priority: 800
      - id: shell-build-intercept-mw
        priority: 900
      - id: shell-download-hint-mw
        priority: 1000
      - id: shell-execute-mw
        priority: 1100
      - id: shell-output-mw
        priority: 1200
      - id: shell-perturbation-audit-mw

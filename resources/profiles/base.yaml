  fork-pipeline:
    nodes:
      - id: crash-snapshot-mw
        priority: 50
        config:
          pipeline-name: Fork
      - id: fork-validation-mw
        priority: 100
      - id: fork-spawn-mw
        priority: 200
      - id: fork-permission-mw
        priority: 300
      - id: fork-execution-mw
        priority: 400

  web-pipeline:
    nodes:
      - id: crash-snapshot-mw
        priority: 50
        config:
          pipeline-name: Web
      - id: web-timeout-mw
        priority: 100
        config:

name: base
consumers:
  chat-pipeline:
    nodes:
      - id: stream-crash-snapshot-mw
        priority: 50
      - id: stream-rate-limit-mw
        priority: 100
        config:
          max-requests: 30
          window-seconds: 60
          # G4 metadata 保留命名空间（业务 config 不得占用 meta. 前缀）：
          # 随 Profile 的 excludes/includes/overrides 一起继承合并，--dump-nodes 真机可见。
          meta.version: "2.1.0"
          meta.dependencies: config-key-registry
          meta.capabilities: rate-limit,audit
          meta.required-capabilities: config-key-registry
      - id: chat-error-handling-mw
        priority: 150
      - id: chat-timing-mw
        priority: 200
      - id: token-budget-mw
        priority: 250
      - id: modality-validation-mw
        priority: 300
      - id: audit-log-mw
        priority: 350
      - id: transcript-persist-mw
        priority: 400
      - id: pre-chat-mw
        priority: 450
      - id: query-loop-mw
        priority: 500
      - id: loop-intervention-mw
        priority: 550
      - id: process-usage-mw
        priority: 600
      - id: cleanup-injections-mw
        priority: 650
      - id: save-context-mw
        priority: 700

  # TASK100 S9（§25）：preprocess 拆成 analyze / prepare 两个消费点。
  # 拆的原因：生产真正执行的那条 preprocess 链是 DI 集合自建的（GetServices<IAnalyze...> /
  # GetServices<IPrepare...>），不看 profile —— 合并成一个消费点时，
  # 「裁掉某个中间件」会在两阶段之间产生歧义（哪个阶段裁？）。
  # 拆开后两条链各自受 profile 治理，与其余 pipeline 的做法一致。
  preprocess-analyze-pipeline:
    nodes:
      - id: crash-snapshot-mw
        priority: 50
        config:
          pipeline-name: PreprocessAnalyze
      - id: keyword-injection-mw
        priority: 100
      - id: synonym-injection-mw
        priority: 200

  preprocess-prepare-pipeline:
    nodes:
      - id: crash-snapshot-mw
        priority: 50
        config:
          pipeline-name: PreprocessPrepare
      - id: system-prompt-mw
        priority: 100
      # TASK130-A6：SessionStart hook 的 additionalContext。必须排在 system-prompt-mw 之后 ——
      # 后者每回合先 ClearDynamicSystemMessagesAsync，排在前面会被清掉。
      - id: session-start-context-mw
        priority: 110
      - id: memory-recall-mw
        priority: 150
      - id: reminder-injection-mw
        priority: 200
      - id: tool-listing-injection-mw
        priority: 300
      - id: lsp-diagnostic-mw
        priority: 400

  chatinit-pipeline:

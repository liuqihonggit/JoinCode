      - id: context-load-mw
        priority: 100
      - id: cost-restore-mw
        priority: 200
      - id: config-change-start-mw
        priority: 300
      - id: session-start-hook-mw
        priority: 400

  chatadmin-pipeline:
    nodes:
      - id: crash-snapshot-mw
        priority: 50
        config:
          pipeline-name: ChatAdmin
      - id: session-admin-mw
        priority: 100
      - id: session-save-mw
        priority: 200


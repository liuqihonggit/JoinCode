# JoinCode 基础工具注册表 — 首轮请求 tools 字段的唯一来源
#
# 设计约束（ADR 0157 v2）:
#   * 只有本清单中的工具进入 AI 供应商协议原生的 tools 数组（完整 schema）
#   * 其余工具一律为独立 CLI.exe，通过各自的 node.yaml + -h 按需阅读
#   * 基础工具不得声明 exe 字段；Exe 为 null 即宿主内实现
#   * 参数描述是单一数据源，禁止再写一份到 C# 特性或提示词里
#
# 这 4 个工具覆盖高频操作；其余能力由 LLM 用 bash 探索 CLI 目录树获得。
#
# 2026-11-16 修正：原第 3 项 code_execution 在 546 个内核工具里**并不存在**（凭空命名），
# 接上主链路后 LLM 会拿到一个永远「工具不存在」的槽位。编译/构建本就由 bash 覆盖，
# 故改为真实高频的 edit（局部查找替换，与 write 的整体覆写互补）。
#
# 2026-11-16 第二次修正（id 必须等于运行时注册名）：内核注册表里的名字是 [EnumValue] 的字符串
# （read / write / edit / bash），不是枚举成员的驼峰（FileRead→file_read）。BuildBaseTools 用
# kernel function.Name 去 registry.Get()，id 写成 file_read 会一条都匹配不上 —— 实测首轮 tools
# 只剩 bash 一个，模型无论如何都读不到文件。同理 CLI 目录里的 id 也已统一到运行时名。

version: 1

tools:
  - id: read
    name: FileRead
    summary: 读取指定路径的文件内容，可按行偏移与行数限制截取
    category: file
    examples:
      - jcc tool call file read --file_path /abs/path/to/File.cs
      - jcc tool call file read --file_path /abs/path/to/File.cs --offset 120 --limit 40
    parameters:
      - name: file_path
        type: string
        description: 要读取的文件绝对路径
        required: true
      - name: offset
        type: integer
        description: 起始行号（从 0 开始），省略则从头读取
        required: false
        default: "0"
        aliases: -o,--offset
      - name: limit
        type: integer
        description: 最多读取的行数，省略则读至文件末尾
        required: false
        aliases: -n,--limit

  - id: write
    name: FileWrite
    summary: 创建或整体覆写指定路径的文件内容
    category: file
    examples:
      - jcc tool call file write --file_path /abs/path/to/File.cs --content "..."
    parameters:
      - name: file_path
        type: string
        description: 目标文件绝对路径
        required: true
      - name: content
        type: string
        description: 要写入的完整文本内容
        required: true
        aliases: -c,--content

  - id: edit
    name: FileEdit
    summary: 在文件中按精确文本查找替换，用于局部修改而非整体覆写
    category: file
    examples:
      - jcc tool call file edit --file_path /abs/path/to/File.cs --old_string "旧片段" --new_string "新片段"
    parameters:
      - name: file_path
        type: string
        description: 要修改的文件路径（相对或绝对）
        required: true
      - name: old_string
        type: string
        description: 要被替换的原文，必须精确匹配
        required: true
      - name: new_string
        type: string
        description: 替换后的新文本
        required: true
      - name: replace_all
        type: boolean
        description: 是否替换全部匹配项
        required: false
        default: "false"

  - id: bash
    name: Bash
    summary: 在 shell 中执行命令，用于系统操作与探索 CLI 工具目录树
    category: shell
    examples:
      - jcc tool call shell bash --command "ls tools/search/"
      - jcc tool call shell bash --command "jcc-rg -h"
      - jcc tool call shell bash --command "jcc tool find pr check"
    parameters:
      - name: command
        type: string
        description: 要执行的 shell 命令
        required: true
        aliases: -c,--command
      - name: description
        type: string
        description: 命令用途的简短说明，用于审计展示
        required: false
      - name: timeout
        type: integer
        description: 超时秒数
        required: false
        default: "120"
        aliases: -t,--timeout

  # Agent 内部基础工具 — 依赖活会话/目标状态，必须每次注册并出现在首轮提示词。
  # 这些 id 同时登记在 group_map.yaml 的 internal_tools 段，生成器会把它们从 agent 独立 exe 中剔除。
  - id: enter_plan_mode
    name: EnterPlanMode
    summary: 进入规划模式 — 先写清目标与步骤，等用户确认后再执行
    category: agent
    examples:
      - enter_plan_mode --description "先确认目标，再列出实现步骤"
    parameters:
      - name: description
        type: string
        description: 规划说明（可选）
        required: false

  - id: exit_plan_mode
    name: ExitPlanMode
    summary: 退出规划模式 — 可按用户确认结果执行剩余已批准步骤
    category: agent
    examples:
      - exit_plan_mode --execute_remaining_steps true
    parameters:
      - name: execute_remaining_steps
        type: boolean
        description: 是否执行剩余已批准步骤
        required: false
      - name: allowed_prompts
        type: array
        description: 执行所需的一次性授权列表（tool + prompt）
        required: false

  - id: goal_get
    name: GoalGet
    summary: 读取当前目标状态（目标、进度、约束、评估结果）；无目标时返回 No active goal
    category: agent
    examples:
      - goal_get
    parameters: []

  - id: goal_update
    name: GoalUpdate
    summary: 更新当前目标状态为 achieved 或 unmet，并写明理由
    category: agent
    examples:
      - goal_update --status achieved --reason "用户确认的目标已全部达成"
    parameters:
      - name: status
        type: string
        description: 目标新状态，只能是 achieved 或 unmet
        required: true
        enum: achieved,unmet
      - name: reason
        type: string
        description: 状态变更原因
        required: true

  - id: goal_graph_define
    name: GoalGraphDefine
    summary: 定义目标图（节点与边），用于多阶段目标拆分与路由
    category: agent
    examples:
      - goal_graph_define --nodes "[...]" --edges "[]" --start_node_id "start" --end_node_ids "done"
    parameters:
      - name: nodes
        type: string
        description: 节点 JSON 数组（id/kind/name/systemPrompt/instruction/freshContext）
        required: true
      - name: edges
        type: string
        description: 边 JSON 数组（fromId/toId/label）
        required: true
      - name: start_node_id
        type: string
        description: 起始节点 id
        required: true
      - name: end_node_ids
        type: string
        description: 结束节点 id，逗号分隔
        required: true

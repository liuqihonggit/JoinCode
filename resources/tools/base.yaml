# JoinCode 基础工具注册表 — 首轮请求 tools 字段的唯一来源
#
# 设计约束（ADR 0157 v2）:
#   * 只有本清单中的工具进入 AI 供应商协议原生的 tools 数组（完整 schema）
#   * 其余工具一律为独立 CLI.exe，通过各自的 node.yaml + -h 按需阅读
#   * 基础工具不得声明 exe 字段；Exe 为 null 即宿主内实现
#   * 参数描述是单一数据源，禁止再写一份到 C# 特性或提示词里
#
# 这 4 个工具覆盖高频操作；其余能力由 LLM 用 bash 探索 CLI 目录树获得。
#
# 2026-11-16 修正：原第 3 项 code_execution 在 546 个内核工具里**并不存在**（凭空命名），
# 接上主链路后 LLM 会拿到一个永远「工具不存在」的槽位。编译/构建本就由 bash 覆盖，
# 故改为真实高频的 file_edit（局部查找替换，与 file_write 的整体覆写互补）。

version: 1

tools:
  - id: file_read
    name: FileRead
    summary: 读取指定路径的文件内容，可按行偏移与行数限制截取
    category: file
    examples:
      - FileRead /abs/path/to/File.cs
      - FileRead /abs/path/to/File.cs --offset 120 --limit 40
    parameters:
      - name: file_path
        type: string
        description: 要读取的文件绝对路径
        required: true
      - name: offset
        type: integer
        description: 起始行号（从 0 开始），省略则从头读取
        required: false
        default: "0"
        aliases: -o,--offset
      - name: limit
        type: integer
        description: 最多读取的行数，省略则读至文件末尾
        required: false
        aliases: -n,--limit

  - id: file_write
    name: FileWrite
    summary: 创建或整体覆写指定路径的文件内容
    category: file
    examples:
      - FileWrite /abs/path/to/File.cs --content "..."
    parameters:
      - name: file_path
        type: string
        description: 目标文件绝对路径
        required: true
      - name: content
        type: string
        description: 要写入的完整文本内容
        required: true
        aliases: -c,--content

  - id: file_edit
    name: FileEdit
    summary: 在文件中按精确文本查找替换，用于局部修改而非整体覆写
    category: file
    examples:
      - FileEdit /abs/path/to/File.cs --old_string "旧片段" --new_string "新片段"
    parameters:
      - name: file_path
        type: string
        description: 要修改的文件路径（相对或绝对）
        required: true
      - name: old_string
        type: string
        description: 要被替换的原文，必须精确匹配
        required: true
      - name: new_string
        type: string
        description: 替换后的新文本
        required: true
      - name: replace_all
        type: boolean
        description: 是否替换全部匹配项
        required: false
        default: "false"

  - id: bash
    name: Bash
    summary: 在 shell 中执行命令，用于系统操作与探索 CLI 工具目录树
    category: shell
    examples:
      - Bash "ls tools/search/"
      - Bash "jcc-rg -h"
      - Bash "jcc tool find pr check"
    parameters:
      - name: command
        type: string
        description: 要执行的 shell 命令
        required: true
        aliases: -c,--command
      - name: description
        type: string
        description: 命令用途的简短说明，用于审计展示
        required: false
      - name: timeout
        type: integer
        description: 超时秒数
        required: false
        default: "120"
        aliases: -t,--timeout

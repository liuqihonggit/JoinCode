# CLI 工具分组映射 — ADR 0157 v3 单一数据源
#
# 背景: [McpTool] 第三参数混用了正式 ToolCategory 字符串与散落标注（code/system/test/mode…），
#       直接当组名会炸出 51 个碎组（其中 20 个组只有 1~3 个工具）。
# 规则: 所有碎类向上归并到 12 个功能大类，每个大类一个独立 CLI.exe。
#       新增工具只需在这里登记其分类，不要在脚本里加分支。
# 未登记的分类一律归入 default，避免再冒出碎组。
#
# 说明: worktree 归 agent 而非 git，使 git 组保持既有的 10 个本地实现工具（groups/git/private/）。
#       github 单独成组，避免单个 exe 塞入 172 个工具。
#       斜杠命令组（groups/slash）不在本表登记：它由 [ChatCommand] 经
#       scripts/generate_slash_cli_node.py 生成，没有 MCP 分类可映射。
#       本表只回答「一个 [McpTool] 分类属于哪个组」，不回答「一共有哪些 exe」。

version: 1
default: system

# 委托执行: 某些组的工具实现已经存在于另一个独立 exe 里,分组 exe 只转发过去。
# 这不是「转发宿主」——被委托方自带实现与凭据,不需要引擎 DI / Hub / 会话状态,
# 跳过宿主即达成进程隔离; 在分组 exe 内重写一份只会得到两份互相对不上的实现。
# 新增委托只在此登记,不要在生成器里加分支。
delegates:
  github:
    exe: jcc-gh
    verb: --call-tool
    project: gh
    reason: github 组 172 个工具由独立 jcc-gh.exe 实现（自带 REST 调用与 hosts.yml 凭据），分组 exe 只做转发。

groups:
  file:
    - file
    - file_transfer
    - snip

  search:
    - search
    - code_index
    - graph

  shell:
    - shell
    - powershell
    - code_execution
    - execution
    - build
    - terminal
    - sandbox
    - repl

  web:
    - web
    - browser

  git:
    - git

  github:
    - github
    - pr_subscription

  code:
    - code
    - code_analysis
    - code_generation
    - lsp
    - notebook

  agent:
    - agent
    - team
    - task
    - plan
    - planning
    - goal
    - todo
    - cron
    - workflow
    - step_evidence
    - brief
    - peers
    - worktree

  mcp:
    - mcp
    - mcp_auth
    - mcp_resource
    - mcp_client

  media:
